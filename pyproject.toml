[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byakuya"
version = "0.1.0"
description = "Byakuya: the tiny, dependency-free HTTP/ASGI core extracted from Night"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "22552"}]
keywords = ["asgi", "web", "framework", "night", "tiny", "byakuya"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
standard = ["uvicorn[standard]>=0.30"]

[project.urls]
Homepage = "https://github.com/22552/all-night/tree/night/tiny"
Repository = "https://github.com/22552/all-night"

[tool.setuptools]
py-modules = ["tnight"]
