<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser Night</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0f12;color:#eee;font-family:system-ui,sans-serif}.browser{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px;background:#171a1f;border-bottom:1px solid #2d333b}.browser button{border:0;border-radius:7px;background:#2a3038;color:#fff;padding:9px 11px;font:inherit}.browser button:disabled{opacity:.4}.browser form{display:flex;gap:8px;flex:1}.browser input{width:100%;border:1px solid #3a424d;border-radius:8px;background:#0f1216;color:#fff;padding:9px 11px;font:inherit}.status{padding:7px 12px;background:#11151a;border-bottom:1px solid #252b33;color:#aab4c0;font-size:12px}.status .error{color:#ffb4b4}.page{min-height:calc(100vh - 90px);padding:20px}.page pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#171a1f;padding:16px;border-radius:10px}.loading{opacity:.72}
</style>
<div class="browser">
  <button id="back" title="Back">←</button>
  <button id="forward" title="Forward">→</button>
  <button id="reload" title="Reload">↻</button>
  <form id="nav-form">
    <input id="address" autocomplete="off" spellcheck="false" aria-label="Night path">
    <button>Go</button>
  </form>
</div>
<div class="status" id="status">Cold starting Browser Night…</div>
<main class="page" id="page"><div class="loading">Loading Pyodide…</div></main>
<script type="module">
const PROJECT_BASE='/all-night';
const ASSET_BASE=new URL(PROJECT_BASE+'/',location.origin);
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const PYODIDE_VERSIONS=isIOS?['0.27.3','0.28.3']:['0.28.3','0.27.3'];
const statusEl=document.querySelector('#status');
const pageEl=document.querySelector('#page');
const addressEl=document.querySelector('#address');
const navForm=document.querySelector('#nav-form');
const backButton=document.querySelector('#back');
const forwardButton=document.querySelector('#forward');
const reloadButton=document.querySelector('#reload');
let pyodide=null;
let publicIp=null;
let ready=false;
let currentVersion='';

function appPathFromLocation(){
  let path=location.pathname;
  if(path===PROJECT_BASE||path===PROJECT_BASE+'/') path='/';
  else if(path.startsWith(PROJECT_BASE+'/')) path=path.slice(PROJECT_BASE.length)||'/';
  path+=location.search;
  return path;
}
function browserUrl(path){
  if(!path.startsWith('/')) path='/'+path;
  return PROJECT_BASE+(path==='/'?'/':path);
}
function setStatus(message,error=false){statusEl.textContent=message;statusEl.classList.toggle('error',error)}
async function text(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`Fetch failed: ${url} (${r.status})`);return await r.text()}
async function loadCompatiblePyodide(){
  const errors=[];
  for(const version of PYODIDE_VERSIONS){
    const base=`https://cdn.jsdelivr.net/pyodide/v${version}/full/`;
    try{
      setStatus(`Cold start: loading Pyodide ${version}…`);
      const{loadPyodide}=await import(base+'pyodide.mjs');
      const runtime=await loadPyodide({indexURL:base});
      currentVersion=version;
      return runtime;
    }catch(error){errors.push(`${version}: ${String(error?.message||error)}`)}
  }
  throw new Error(`No Pyodide runtime could start. ${errors.join(' | ')}`);
}
async function discoverPublicIp(){
  if(!globalThis.RTCPeerConnection)return null;
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.cloudflare.com:3478'}]});
  try{
    pc.createDataChannel('night-stun');
    return await new Promise(async resolve=>{
      let done=false;const finish=v=>{if(!done){done=true;resolve(v)}};const timer=setTimeout(()=>finish(null),3500);
      pc.onicecandidate=e=>{const c=e.candidate;if(!c){clearTimeout(timer);finish(null);return}if(c.type!=='srflx')return;const a=c.address||c.candidate?.split(' ')[4]||null;if(a){clearTimeout(timer);finish(a)}};
      await pc.setLocalDescription(await pc.createOffer());
    });
  }catch{return null}finally{pc.close()}
}
async function boot(){
  pyodide=await loadCompatiblePyodide();
  setStatus(`Cold start: loading sqlite3 on Pyodide ${currentVersion}…`);
  await pyodide.loadPackage('sqlite3');
  setStatus('Cold start: loading Night…');
  pyodide.FS.mkdirTree('/night');
  const[night,web,requestInfo,app]=await Promise.all([
    text('https://raw.githubusercontent.com/22552/all-night/main/night.py'),
    text('https://raw.githubusercontent.com/22552/all-night/main/night_web.py'),
    text('https://raw.githubusercontent.com/22552/all-night/main/night_request_info.py'),
    text(new URL('app.py',ASSET_BASE)),
  ]);
  pyodide.FS.writeFile('/night/night.py',night);
  pyodide.FS.writeFile('/night/night_web.py',web);
  pyodide.FS.writeFile('/night/night_request_info.py',requestInfo);
  pyodide.FS.writeFile('/night/app.py',app);
  await pyodide.runPythonAsync(`
import sys
sys.path.insert(0,'/night')
from app import app
from night_web import handle_web
`);
  publicIp=await discoverPublicIp();
  ready=true;
  setStatus(`Ready · Pyodide ${currentVersion}${publicIp?' · STUN '+publicIp:''}`);
}
async function dispatch(path,{push=false,replace=false}={}){
  if(!ready)return;
  if(!path.startsWith('/'))path='/'+path;
  if(push)history.pushState({night:true},'',browserUrl(path));
  else if(replace)history.replaceState({night:true},'',browserUrl(path));
  addressEl.value=path;
  pageEl.innerHTML='<div class="loading">Loading route…</div>';
  setStatus(`Night → GET ${path}`);
  try{
    pyodide.globals.set('_url',new URL(path,location.origin).href);
    pyodide.globals.set('_client_ip',publicIp);
    const result=await pyodide.runPythonAsync(`
_info={'platform':'browser'}
if _client_ip:
    _info['client_ip']=str(_client_ip)
_result=await handle_web(app,method='GET',url=_url,headers=[('user-agent','Browser Night / Pyodide')],body=b'',platform_info=_info)
_result.as_tuple()
`);
    const js=result.toJs({create_proxies:false});
    const statusCode=Number(js[0]);
    const headers=js[1];
    const raw=js[2] instanceof Uint8Array?js[2]:new Uint8Array(js[2]);
    const body=new TextDecoder().decode(raw);
    const contentType=headers.find(([k])=>String(k).toLowerCase()==='content-type')?.[1]||'';
    setStatus(`Night ${statusCode} · ${path} · Pyodide ${currentVersion}`);
    if(contentType.includes('text/html')){
      pageEl.innerHTML=body;
    }else if(contentType.includes('application/json')){
      try{pageEl.innerHTML=`<pre>${escapeHtml(JSON.stringify(JSON.parse(body),null,2))}</pre>`}catch{pageEl.innerHTML=`<pre>${escapeHtml(body)}</pre>`}
    }else{
      pageEl.innerHTML=`<pre>${escapeHtml(body)}</pre>`;
    }
  }catch(error){
    setStatus(`Route failed · ${path}`,true);
    pageEl.innerHTML=`<pre>${escapeHtml(String(error?.stack||error))}</pre>`;
  }
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
navForm.addEventListener('submit',e=>{e.preventDefault();dispatch(addressEl.value,{push:true})});
backButton.addEventListener('click',()=>history.back());
forwardButton.addEventListener('click',()=>history.forward());
reloadButton.addEventListener('click',()=>dispatch(appPathFromLocation()));
window.addEventListener('popstate',()=>dispatch(appPathFromLocation()));
pageEl.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a)return;
  const url=new URL(a.href,location.href);
  if(url.origin!==location.origin)return;
  if(!url.pathname.startsWith(PROJECT_BASE))return;
  e.preventDefault();
  let path=url.pathname.slice(PROJECT_BASE.length)||'/';
  path+=url.search;
  dispatch(path,{push:true});
});

try{
  await boot();
  const initial=appPathFromLocation();
  history.replaceState({night:true},'',browserUrl(initial));
  await dispatch(initial);
}catch(error){
  setStatus('Browser Night cold start failed',true);
  pageEl.innerHTML=`<pre>${escapeHtml(String(error?.stack||error))}</pre>`;
}
</script>
