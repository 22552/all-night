<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Browser Night</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--chrome:#141920;--line:#2b3440;--text:#f6f8fb;--muted:#9aa6b5;--accent:#7cc4ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr}.chrome{padding:10px 12px 12px;background:linear-gradient(180deg,#171c23,#12171d);border-bottom:1px solid var(--line);box-shadow:0 10px 30px #0006;z-index:10}.top{display:flex;align-items:center;gap:10px;margin-bottom:9px}.traffic{display:flex;gap:7px}.dot{width:11px;height:11px;border-radius:50%;background:#414955}.brand{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.runtime{margin-left:auto;font-size:11px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px}.nav{display:flex;gap:6px}.btn,.go{border:1px solid var(--line);background:#202730;color:var(--text);border-radius:10px;height:38px;min-width:38px;padding:0 11px;cursor:pointer}.address-wrap{display:flex;align-items:center;gap:8px;border:1px solid #37414f;background:#0d1116;border-radius:12px;padding:0 12px}.address{width:100%;height:38px;border:0;outline:0;background:transparent;color:#f8fafc;font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace}.go{padding:0 16px;font-weight:700}.progress{height:2px;margin-top:9px}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#7cc4ff,#a78bfa);transition:width .18s,opacity .2s}.viewport{position:relative;min-height:0;background:white}.frame{width:100%;height:100%;border:0;background:white}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0d10ee;transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(520px,100%);padding:24px;border:1px solid #ffffff14;border-radius:18px;background:#171d25}.status{margin-top:16px;padding:12px;border-radius:12px;background:#0c1117;color:#cbd5e1;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}@media(max-width:650px){.traffic,.runtime,.go{display:none}.toolbar{grid-template-columns:auto 1fr}.chrome{padding:8px}}
</style>
<div class="app">
<header class="chrome"><div class="top"><div class="traffic"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="brand">Browser Night</div><div id="runtime" class="runtime">cold start</div></div><form id="nav-form" class="toolbar"><div class="nav"><button type="button" class="btn" id="back">←</button><button type="button" class="btn" id="forward">→</button><button type="button" class="btn" id="reload">↻</button></div><label class="address-wrap"><input id="address" class="address" autocomplete="off" spellcheck="false"></label><button class="go">Go</button></form><div class="progress"><span id="progress"></span></div></header>
<main class="viewport"><iframe id="frame" class="frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads allow-same-origin"></iframe><div id="overlay" class="overlay"><div class="card"><strong>Starting Browser Night</strong><div id="status" class="status">Initializing…</div></div></div></main>
</div>
<script type="module">
const PROJECT_BASE='/all-night';
const ASSET_BASE=new URL(PROJECT_BASE+'/',location.origin);
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const PYODIDE_VERSIONS=isIOS?['0.27.3','0.28.3']:['0.28.3','0.27.3'];
const frame=document.querySelector('#frame'),overlay=document.querySelector('#overlay'),statusEl=document.querySelector('#status'),runtimeEl=document.querySelector('#runtime'),progressEl=document.querySelector('#progress'),addressEl=document.querySelector('#address');
let pyodide=null,publicIp=null,currentVersion='',ready=false,settingSrcdoc=false;
function appPathFromLocation(){let p=location.pathname;if(p===PROJECT_BASE||p===PROJECT_BASE+'/')p='/';else if(p.startsWith(PROJECT_BASE+'/'))p=p.slice(PROJECT_BASE.length)||'/';return p+location.search}
function browserUrl(path){if(!path.startsWith('/'))path='/'+path;return PROJECT_BASE+(path==='/'?'/':path)}
function setStatus(s){statusEl.textContent=s}function setProgress(v){progressEl.style.width=v+'%';progressEl.style.opacity=v>=100?'0':'1'}
async function text(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`${url}: ${r.status}`);return r.text()}
async function loadPy(){for(const version of PYODIDE_VERSIONS){const base=`https://cdn.jsdelivr.net/pyodide/v${version}/full/`;try{setStatus(`Loading Pyodide ${version}…`);setProgress(20);const{loadPyodide}=await import(base+'pyodide.mjs');const rt=await loadPyodide({indexURL:base});currentVersion=version;return rt}catch{}}throw new Error('Pyodide failed')}
async function stun(){if(!globalThis.RTCPeerConnection)return null;const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.cloudflare.com:3478'}]});try{pc.createDataChannel('night');return await new Promise(async resolve=>{let done=false;const finish=v=>{if(!done){done=true;resolve(v)}};setTimeout(()=>finish(null),2500);pc.onicecandidate=e=>{const c=e.candidate;if(c?.type==='srflx')finish(c.address||c.candidate?.split(' ')[4]||null)};await pc.setLocalDescription(await pc.createOffer())})}catch{return null}finally{pc.close()}}
async function boot(){pyodide=await loadPy();setStatus('Loading sqlite3…');setProgress(38);await pyodide.loadPackage('sqlite3');setStatus('Loading Night…');setProgress(58);pyodide.FS.mkdirTree('/night');const[night,web,info,app]=await Promise.all([text('https://raw.githubusercontent.com/22552/all-night/main/night.py'),text('https://raw.githubusercontent.com/22552/all-night/main/night_web.py'),text('https://raw.githubusercontent.com/22552/all-night/main/night_request_info.py'),text(new URL('app.py',ASSET_BASE))]);pyodide.FS.writeFile('/night/night.py',night);pyodide.FS.writeFile('/night/night_web.py',web);pyodide.FS.writeFile('/night/night_request_info.py',info);pyodide.FS.writeFile('/night/app.py',app);setProgress(78);await pyodide.runPythonAsync(`import sys\nsys.path.insert(0,'/night')\nfrom app import app\nfrom night_web import handle_web`);publicIp=await stun();ready=true;runtimeEl.textContent=`Pyodide ${currentVersion} · warm`;setProgress(100);overlay.classList.add('hidden')}
async function nightFetch(path,method='GET',headers=[],body=''){if(!path.startsWith('/'))path='/'+path;pyodide.globals.set('_method',method);pyodide.globals.set('_url',new URL(path,location.origin).href);pyodide.globals.set('_headers',headers);pyodide.globals.set('_body_text',body||'');pyodide.globals.set('_client_ip',publicIp);const result=await pyodide.runPythonAsync(`\n_info={'platform':'browser'}\nif _client_ip:\n    _info['client_ip']=str(_client_ip)\n_result=await handle_web(app,method=str(_method),url=str(_url),headers=_headers.to_py() if hasattr(_headers,'to_py') else _headers,body=str(_body_text).encode(),platform_info=_info)\n_result.as_tuple()\n`);const js=result.toJs({create_proxies:false});return{status:Number(js[0]),headers:js[1],body:js[2] instanceof Uint8Array?js[2]:new Uint8Array(js[2])}}
function bridgeScript(){return `<script>(()=>{const PROJECT_BASE=${JSON.stringify(PROJECT_BASE)};let seq=0;const pending=new Map();const nativeFetch=window.fetch.bind(window);function nightUrl(raw){const x=new URL(raw,location.href);return x.origin===location.origin&&(x.pathname===PROJECT_BASE||x.pathname.startsWith(PROJECT_BASE+'/'))?x:null}window.addEventListener('message',e=>{const m=e.data;if(!m||m.type!=='night-fetch-result')return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);p.resolve(new Response(Uint8Array.from(m.body||[]),{status:m.status,headers:new Headers(m.headers||[])}))});window.fetch=(input,init={})=>{const req=input instanceof Request?input:new Request(input,init);if(!nightUrl(req.url))return nativeFetch(input,init);return new Promise(async(resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});let body='';try{if(req.method!=='GET'&&req.method!=='HEAD')body=await req.clone().text()}catch{};parent.postMessage({type:'night-fetch',id,url:req.url,method:req.method,headers:[...req.headers.entries()],body},'*')})};const rerouteLinks=()=>{for(const a of document.querySelectorAll('a[href]')){const u=nightUrl(a.href);if(!u||a.dataset.nightHref)continue;a.dataset.nightHref=u.href;a.removeAttribute('href');a.setAttribute('role','link');a.tabIndex=0}};const navigate=a=>{const href=a?.dataset?.nightHref;if(!href)return false;parent.postMessage({type:'night-navigate',url:href},'*');return true};const onClick=e=>{const a=e.target.closest&&e.target.closest('a[data-night-href]');if(!a)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();navigate(a)};const onKey=e=>{if(e.key!=='Enter'&&e.key!==' ')return;const a=e.target.closest&&e.target.closest('a[data-night-href]');if(!a)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();navigate(a)};window.addEventListener('click',onClick,true);document.addEventListener('click',onClick,true);document.addEventListener('keydown',onKey,true);document.addEventListener('submit',e=>{const form=e.target;if(!(form instanceof HTMLFormElement))return;const action=nightUrl(form.action||location.href);if(!action)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const fd=new FormData(form);if((form.method||'get').toLowerCase()==='get'){for(const[k,v]of fd)action.searchParams.append(k,String(v));parent.postMessage({type:'night-navigate',url:action.href},'*')}} ,true);new MutationObserver(rerouteLinks).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['href']});rerouteLinks();})();<\/script>`}
function renderDocument(bytes,type){const raw=new TextDecoder().decode(bytes);if(!type.includes('text/html')){const esc=raw.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));return `<!doctype html><html><head><meta charset="utf-8"><base href="${location.origin}${PROJECT_BASE}/">${bridgeScript()}<style>html{color-scheme:light}body{margin:0;padding:18px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;color:#111}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><pre>${esc}</pre></body></html>`}const doc=new DOMParser().parseFromString(raw,'text/html');let base=doc.head.querySelector('base');if(!base){base=doc.createElement('base');doc.head.prepend(base)}base.href=`${location.origin}${PROJECT_BASE}/`;for(const a of doc.querySelectorAll('a[href]')){try{const u=new URL(a.getAttribute('href'),`${location.origin}${PROJECT_BASE}/`);if(u.origin===location.origin&&(u.pathname===PROJECT_BASE||u.pathname.startsWith(PROJECT_BASE+'/'))){a.setAttribute('data-night-href',u.href);a.removeAttribute('href');a.setAttribute('role','link');a.setAttribute('tabindex','0')}}catch{}}const bridge=doc.createElement('script');bridge.textContent=bridgeScript().replace(/^<script>|<\\\/script>$/g,'');doc.head.prepend(bridge);return '<!doctype html>'+doc.documentElement.outerHTML}
async function dispatch(path,{push=false}={}){if(!ready)return;if(!path.startsWith('/'))path='/'+path;if(push)history.pushState({night:true},'',browserUrl(path));addressEl.value=path;runtimeEl.textContent=`GET ${path}`;setProgress(25);const r=await nightFetch(path);const type=r.headers.find(([k])=>String(k).toLowerCase()==='content-type')?.[1]||'';setProgress(80);settingSrcdoc=true;frame.srcdoc=renderDocument(r.body,type);runtimeEl.textContent=`${r.status} · Pyodide ${currentVersion}`;setProgress(100)}
frame.addEventListener('load',()=>{if(settingSrcdoc){settingSrcdoc=false;return}try{const href=frame.contentWindow.location.href;if(!href||href==='about:srcdoc'||href==='about:blank')return;const u=new URL(href);if(u.origin===location.origin&&(u.pathname===PROJECT_BASE||u.pathname.startsWith(PROJECT_BASE+'/'))){let path=u.pathname.slice(PROJECT_BASE.length)||'/';path+=u.search;try{frame.contentWindow.stop()}catch{};dispatch(path,{push:true})}}catch{}});
window.addEventListener('message',async e=>{const m=e.data;if(!m)return;if(m.type==='night-fetch'){try{const u=new URL(m.url,location.href);let path=u.pathname.startsWith(PROJECT_BASE)?u.pathname.slice(PROJECT_BASE.length)||'/':u.pathname;path+=u.search;const r=await nightFetch(path,m.method,m.headers,m.body);e.source?.postMessage({type:'night-fetch-result',id:m.id,status:r.status,headers:r.headers,body:Array.from(r.body)},'*')}catch(err){e.source?.postMessage({type:'night-fetch-result',id:m.id,status:500,headers:[['content-type','text/plain']],body:Array.from(new TextEncoder().encode(String(err)))},'*')}}else if(m.type==='night-navigate'){const u=new URL(m.url,location.href);let path=u.pathname.slice(PROJECT_BASE.length)||'/';path+=u.search;dispatch(path,{push:true})}});
document.querySelector('#nav-form').addEventListener('submit',e=>{e.preventDefault();dispatch(addressEl.value,{push:true})});document.querySelector('#back').onclick=()=>history.back();document.querySelector('#forward').onclick=()=>history.forward();document.querySelector('#reload').onclick=()=>dispatch(appPathFromLocation());window.addEventListener('popstate',()=>dispatch(appPathFromLocation()));
try{await boot();const initial=appPathFromLocation();history.replaceState({night:true},'',browserUrl(initial));await dispatch(initial)}catch(e){setStatus(String(e?.stack||e));runtimeEl.textContent='failed';setProgress(100)}
</script>
