<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night in the Browser</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;background:#111;color:#eee}input,select,textarea,button{font:inherit}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #444;border-radius:8px;background:#181818;color:#fff}textarea{min-height:100px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.row{display:grid;grid-template-columns:120px 1fr;gap:10px}pre{white-space:pre-wrap;background:#181818;padding:14px;border-radius:8px;min-height:120px}.muted{color:#999}.meta{background:#181818;padding:10px 14px;border-radius:8px;margin:12px 0 20px}.error{color:#ffb4b4}
</style>
<h1>Night in the Browser</h1>
<p class="muted">Pyodide + Night. Requests are executed locally in this tab.</p>
<p id="status">Loading Pyodide module…</p>
<div class="meta">STUN public IP: <strong id="stun-ip">detecting…</strong><br>Pyodide: <strong id="pyodide-version">loading…</strong><br>Runtime attempts: <strong id="pyodide-attempts">waiting…</strong><br>Night: <strong id="night-status">waiting…</strong><br>Error: <strong id="error-summary">none</strong></div>
<div class="row">
  <select id="method"><option>GET</option><option>POST</option></select>
  <input id="path" value="/" placeholder="/hello/night">
</div>
<textarea id="body" placeholder="Request body for POST"></textarea>
<button id="run" disabled>Run Night request</button>
<pre id="output"></pre>
<script type="module">
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const PYODIDE_VERSIONS = isIOS ? ['0.27.3', '0.28.3'] : ['0.28.3', '0.27.3'];
const APP_BASE = new URL('./', location.href);
const status = document.querySelector('#status');
const run = document.querySelector('#run');
const output = document.querySelector('#output');
const methodEl = document.querySelector('#method');
const pathEl = document.querySelector('#path');
const bodyEl = document.querySelector('#body');
const stunIpEl = document.querySelector('#stun-ip');
const pyodideVersionEl = document.querySelector('#pyodide-version');
const pyodideAttemptsEl = document.querySelector('#pyodide-attempts');
const nightStatusEl = document.querySelector('#night-status');
const errorSummaryEl = document.querySelector('#error-summary');
let stunPublicIp = null;
let pyodide;
let runtimeReady = false;

async function text(url){
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error(`Fetch failed: ${url} (${r.status})`);
  return await r.text();
}

function reportError(error){
  const full = String(error?.stack || error);
  console.error('[Browser Night]', error);
  output.textContent = full;
  const firstUseful = full.split('\n').find(line => line.trim() && !line.includes('module code@')) || full.split('\n')[0] || 'unknown error';
  errorSummaryEl.textContent = firstUseful.trim();
  errorSummaryEl.classList.add('error');
}

function showPythonFailure(stage, report){
  const full = `${stage} failed:\n${report}`;
  console.error('[Browser Night]', full);
  status.textContent = `${stage} failed`;
  nightStatusEl.textContent = 'failed ✗';
  errorSummaryEl.textContent = String(report).split('\n').find(line => line.trim()) || `${stage} failed`;
  errorSummaryEl.classList.add('error');
  output.textContent = full;
  run.disabled = true;
}

function jsString(value){
  if(value == null) return '';
  return typeof value === 'string' ? value : String(value);
}

async function pythonImportReport(code){
  try { pyodide.globals.delete('_night_import_report'); } catch {}
  await pyodide.runPythonAsync(`
import traceback
_night_import_report = 'ok'
try:
${code.split('\n').map(line => '    ' + line).join('\n')}
except BaseException:
    _night_import_report = traceback.format_exc()
`);
  return jsString(pyodide.globals.get('_night_import_report'));
}

async function enablePyodideCache(){
  if(!('serviceWorker' in navigator) || location.protocol === 'file:') return false;
  try{
    await navigator.serviceWorker.register(new URL('sw.js', APP_BASE), {scope: APP_BASE.pathname});
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller){
      await Promise.race([
        new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange', resolve, {once:true})),
        new Promise(resolve => setTimeout(resolve, 1500)),
      ]);
    }
    return Boolean(navigator.serviceWorker.controller);
  }catch(error){
    console.warn('[Browser Night] Pyodide cache unavailable', error);
    return false;
  }
}

async function loadCompatiblePyodide(){

  const errors = [];
  const attempts = [];
  for(const version of PYODIDE_VERSIONS){
    const base = `https://cdn.jsdelivr.net/pyodide/v${version}/full/`;
    attempts.push(`${version}…`);
    pyodideAttemptsEl.textContent = attempts.join(' → ');
    try{
      status.textContent = `Loading Pyodide ${version} module…`;
      const {loadPyodide} = await import(base + 'pyodide.mjs');
      status.textContent = `Starting Python runtime (Pyodide ${version})…`;
      const runtime = await loadPyodide({indexURL: base});
      attempts[attempts.length - 1] = `${version} ✓`;
      pyodideAttemptsEl.textContent = attempts.join(' → ');
      pyodideVersionEl.textContent = version;
      runtimeReady = true;
      return runtime;
    }catch(error){
      attempts[attempts.length - 1] = `${version} ✗`;
      pyodideAttemptsEl.textContent = attempts.join(' → ');
      errors.push(`Pyodide ${version}: ${String(error?.message || error)}`);
      console.warn(`Pyodide ${version} failed`, error);
    }
  }
  throw new Error(`No Pyodide runtime could start.\n${errors.join('\n')}`);
}

function isPublicAddress(address){
  if(!address) return false;
  if(address.includes(':')){
    const value = address.toLowerCase();
    return !(value === '::1' || value.startsWith('fe80:') || value.startsWith('fc') || value.startsWith('fd'));
  }
  const parts = address.split('.').map(Number);
  if(parts.length !== 4 || parts.some(n => !Number.isInteger(n) || n < 0 || n > 255)) return false;
  const [a,b] = parts;
  return !(a===10||a===127||a===0||(a===169&&b===254)||(a===172&&b>=16&&b<=31)||(a===192&&b===168)||(a===100&&b>=64&&b<=127));
}

async function detectPublicIp(){
  if(!('RTCPeerConnection' in globalThis)) return null;
  const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.cloudflare.com:3478'}]});
  try{
    pc.createDataChannel('night-stun');
    const result = new Promise(resolve => {
      let settled=false;
      const finish=value=>{if(settled)return;settled=true;resolve(value)};
      const timer=setTimeout(()=>finish(null),5000);
      pc.addEventListener('icecandidate', event=>{
        const candidate=event.candidate;
        if(!candidate){clearTimeout(timer);finish(null);return}
        if(candidate.type!=='srflx') return;
        const address=candidate.address||candidate.candidate?.split(' ')[4]||null;
        if(isPublicAddress(address)){clearTimeout(timer);finish(address)}
      });
    });
    await pc.setLocalDescription(await pc.createOffer());
    return await result;
  }catch{return null}finally{pc.close()}
}

const stunPromise = detectPublicIp().then(ip=>{
  stunPublicIp=ip;
  stunIpEl.textContent=ip||'unavailable';
  return ip;
});

try {
  const cacheReady = await enablePyodideCache();
  status.textContent = cacheReady ? 'Pyodide cache ready — loading runtime…' : 'Loading Pyodide without persistent cache…';
  pyodide = await loadCompatiblePyodide();

  nightStatusEl.textContent = 'loading sqlite3…';
  status.textContent = 'Loading sqlite3 support…';
  try {
    await pyodide.loadPackage('sqlite3');
  } catch (sqliteError) {
    const sqliteReport = String(sqliteError?.stack || sqliteError);
    showPythonFailure('sqlite3 package load', sqliteReport);
    throw sqliteError;
  }

  nightStatusEl.textContent = 'loading sources…';
  status.textContent = 'Loading Night sources…';
  pyodide.FS.mkdirTree('/night');
  const [night, web, requestInfo, app] = await Promise.all([
    text('https://raw.githubusercontent.com/22552/all-night/main/night.py'),
    text('https://raw.githubusercontent.com/22552/all-night/main/night_web.py'),
    text('https://raw.githubusercontent.com/22552/all-night/main/night_request_info.py'),
    text(new URL('app.py', APP_BASE)),
  ]);
  pyodide.FS.writeFile('/night/night.py', night);
  pyodide.FS.writeFile('/night/night_web.py', web);
  pyodide.FS.writeFile('/night/night_request_info.py', requestInfo);
  pyodide.FS.writeFile('/night/app.py', app);

  await pyodide.runPythonAsync(`import sys\nsys.path.insert(0, '/night')`);

  nightStatusEl.textContent = 'importing night.py…';
  status.textContent = 'Importing night.py…';
  let importReport = await pythonImportReport('import night');
  if(importReport !== 'ok') {
    showPythonFailure('night.py import', importReport || '(empty diagnostic)');
  } else {
    nightStatusEl.textContent = 'importing app.py…';
    status.textContent = 'Importing app.py…';
    importReport = await pythonImportReport('from app import app');
    if(importReport !== 'ok') {
      showPythonFailure('app.py import', importReport || '(empty diagnostic)');
    } else {
      nightStatusEl.textContent = 'importing adapter…';
      status.textContent = 'Importing Night web adapter…';
      importReport = await pythonImportReport('from night_web import handle_web\nfrom night_request_info import from_scope');
      if(importReport !== 'ok') {
        showPythonFailure('Night adapter import', importReport || '(empty diagnostic)');
      } else {
        nightStatusEl.textContent = 'ready ✓';
        errorSummaryEl.textContent = 'none';
        errorSummaryEl.classList.remove('error');
        await stunPromise;
        status.textContent = 'Ready — Night is running locally in your browser.';
        run.disabled = false;
      }
    }
  }
} catch (e) {
  status.textContent = runtimeReady ? 'Night failed to start' : 'Pyodide failed to start';
  if(!runtimeReady) pyodideVersionEl.textContent = 'failed';
  if(runtimeReady && nightStatusEl.textContent !== 'failed ✗') nightStatusEl.textContent = 'failed ✗';
  reportError(e);
}

run.onclick = async () => {
  if(!pyodide) return;
  run.disabled = true;
  output.textContent = 'Running…';
  try {
    const method = methodEl.value;
    const path = pathEl.value.startsWith('/') ? pathEl.value : '/' + pathEl.value;
    const body = new TextEncoder().encode(bodyEl.value);
    pyodide.globals.set('_method', method);
    pyodide.globals.set('_url', new URL(path, location.href).href);
    pyodide.globals.set('_body', Array.from(body));
    pyodide.globals.set('_stun_ip', stunPublicIp);
    const result = await pyodide.runPythonAsync(`
_platform_info = {'platform': 'browser'}
if _stun_ip:
    _platform_info['client_ip'] = str(_stun_ip)
_result = await handle_web(
    app,
    method=_method,
    url=_url,
    headers=[('content-type', 'text/plain; charset=utf-8'), ('user-agent', 'Browser Night / Pyodide')],
    body=bytes(_body.to_py()),
    platform_info=_platform_info,
)
_result.as_tuple()
`);
    const js = result.toJs({create_proxies:false});
    result.destroy?.();
    const statusCode = Number(js[0]);
    const headers = js[1];
    const raw = js[2] instanceof Uint8Array ? js[2] : new Uint8Array(js[2]);
    output.textContent = `HTTP ${statusCode}\n${headers.map(([k,v])=>`${k}: ${v}`).join('\n')}\n\n${new TextDecoder().decode(raw)}`;
  } catch (e) {
    reportError(e);
  } finally {
    run.disabled = false;
  }
};
</script>
