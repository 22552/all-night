name: response fast-path experiment

on:
  push:
    branches:
      - perf/response-fastpath
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/response-fastpath
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Save main baseline and apply patch
        run: |
          git show origin/main:night.py > /tmp/night_base.py
          python tools/response_fastpath_patch.py

      - name: Install test and standard dependencies
        run: |
          python -m pip install -U pytest pytest-asyncio
          python -m pip install 'uvicorn[standard]>=0.30' 'orjson>=3.10'

      - name: Run tests
        run: PYTHONPATH=. pytest -q

      - name: Microbenchmark response construction
        run: |
          python - <<'PY'
          import importlib.util
          import time
          import night as fast

          spec = importlib.util.spec_from_file_location('night_base', '/tmp/night_base.py')
          base = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(base)

          def bench(mod, n=200_000):
              start=time.perf_counter()
              for i in range(n):
                  r=mod.JSONResponse({'id': 42, 'ok': True})
                  r.asgi_headers()
              return time.perf_counter()-start

          for _ in range(2):
              bench(base, 10_000); bench(fast, 10_000)
          b=bench(base); f=bench(fast)
          print(f'base response: {b:.6f}s ({200000/b:.1f}/s)')
          print(f'fast response: {f:.6f}s ({200000/f:.1f}/s)')
          print(f'improvement: {(b/f-1)*100:.2f}%')
          PY

      - name: Install oha
        run: |
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha

      - name: Create A/B apps
        run: |
          cat > bench_base.py <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('night_base','/tmp/night_base.py')
          night_base=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(night_base)
          app=night_base.Night()
          @app.get('/')
          async def root(): return {'message':'hello'}
          @app.get('/users/<int:user_id>')
          async def user(user_id:int): return {'id':user_id}
          PY
          cat > bench_fast.py <<'PY'
          from night import Night
          app=Night()
          @app.get('/')
          async def root(): return {'message':'hello'}
          @app.get('/users/<int:user_id>')
          async def user(user_id:int): return {'id':user_id}
          PY

      - name: Run same-runner HTTP A/B
        shell: bash
        run: |
          set -euo pipefail
          wait_ready(){ for i in $(seq 1 100); do curl -fsS "$1" >/dev/null 2>&1 && return 0; sleep .1; done; return 1; }
          run_one(){
            mod="$1"; port="$2"; label="$3"
            python -m uvicorn "${mod}:app" --host 127.0.0.1 --port "$port" --workers 1 --no-access-log >/tmp/${label}.log 2>&1 &
            pid=$!
            wait_ready "http://127.0.0.1:${port}/"
            timeout 10s oha -n 200 -c 25 --no-tui --output-format quiet "http://127.0.0.1:${port}/" >/dev/null
            for path_name in static dynamic; do
              if [ "$path_name" = static ]; then path='/'; else path='/users/42'; fi
              for round in 1 2 3; do
                timeout 10s oha -n 1000 -c 25 --no-tui --output-format json "http://127.0.0.1:${port}${path}" > "/tmp/${label}-${path_name}-${round}.json"
              done
            done
            kill -9 "$pid" 2>/dev/null || true
          }
          run_one bench_base 8011 base
          run_one bench_fast 8012 fast

      - name: Summarize HTTP A/B
        run: |
          python - <<'PY'
          import json, statistics
          for endpoint in ('static','dynamic'):
              vals={}
              for label in ('base','fast'):
                  xs=[]
                  for r in (1,2,3):
                      d=json.load(open(f'/tmp/{label}-{endpoint}-{r}.json'))
                      xs.append(d['summary']['requestsPerSec'])
                  vals[label]=xs
                  print(label, endpoint, 'rounds=', ', '.join(f'{x:.1f}' for x in xs), 'median=', f'{statistics.median(xs):.1f}')
              b=statistics.median(vals['base']); f=statistics.median(vals['fast'])
              print(endpoint, 'improvement=', f'{(f/b-1)*100:.2f}%')
          PY

      - name: Standard install smoke test
        run: |
          python - <<'PY'
          import importlib.util
          import night_midnight, night_midnight_dev
          assert importlib.util.find_spec('orjson') is not None
          assert importlib.util.find_spec('websockets') is not None
          print('standard stack: orjson + websockets + Midnight OK')
          PY

      - name: Commit successful patch
        run: |
          if git diff --quiet -- night.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add night.py
          git commit -m 'optimize response construction hot path'
          git push origin HEAD:perf/response-fastpath
