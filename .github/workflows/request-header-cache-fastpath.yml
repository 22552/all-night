name: Request header cache fastpath

on:
  push:
    branches: [perf/request-lazy-header-cache]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-lazy-header-cache
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: |
          python -m pip install -U pytest uvicorn
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
      - name: Load main baseline
        run: |
          git fetch origin main --depth=1
          git show origin/main:night.py > /tmp/night_baseline.py
      - name: Test
        run: PYTHONPATH=. pytest -q
      - name: Create apps
        run: |
          cat > bench_base.py <<'PY'
          import importlib.util, sys
          spec=importlib.util.spec_from_file_location('night_base','/tmp/night_baseline.py')
          n=importlib.util.module_from_spec(spec); sys.modules['night_base']=n; spec.loader.exec_module(n)
          app=n.Night()
          @app.get('/')
          async def root(): return {'message':'hello'}
          @app.get('/users/<int:user_id>')
          async def user(user_id:int): return {'id':user_id}
          PY
          cat > bench_fast.py <<'PY'
          from night import Night
          app=Night()
          @app.get('/')
          async def root(): return {'message':'hello'}
          @app.get('/users/<int:user_id>')
          async def user(user_id:int): return {'id':user_id}
          PY
      - name: Interleaved HTTP A/B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-results
          uvicorn bench_base:app --host 127.0.0.1 --port 8001 --workers 1 --no-access-log >/tmp/base.log 2>&1 & BPID=$!
          uvicorn bench_fast:app --host 127.0.0.1 --port 8002 --workers 1 --no-access-log >/tmp/fast.log 2>&1 & FPID=$!
          trap 'kill -9 "$BPID" "$FPID" 2>/dev/null || true' EXIT
          for port in 8001 8002; do for i in $(seq 1 100); do curl -fsS "http://127.0.0.1:$port/" >/dev/null 2>&1 && break; sleep .1; done; done
          hit(){ local n=$1 p=$2 e=$3 r=$4; [[ $e == static ]] && path=/ || path=/users/42; timeout 10s oha -n 2000 -c 50 --no-tui --output-format json "http://127.0.0.1:$p$path" > "bench-results/$n-$e-$r.json"; }
          for e in static dynamic; do
            hit base 8001 $e 1; hit fast 8002 $e 1; hit fast 8002 $e 2; hit base 8001 $e 2
            hit base 8001 $e 3; hit fast 8002 $e 3; hit fast 8002 $e 4; hit base 8001 $e 4
          done
      - name: Summarize
        run: |
          python - <<'PY'
          import json, statistics
          for e in ('static','dynamic'):
              d={}
              for n in ('base','fast'):
                  xs=[json.load(open(f'bench-results/{n}-{e}-{r}.json'))['summary']['requestsPerSec'] for r in (1,2,3,4)]
                  d[n]=(statistics.median(xs),xs)
              b,f=d['base'],d['fast']
              print(f'{e}: {b[0]:.1f} -> {f[0]:.1f} req/s ({(f[0]/b[0]-1)*100:+.2f}%)')
              print(' base',*[f'{x:.1f}' for x in b[1]])
              print(' fast',*[f'{x:.1f}' for x in f[1]])
          PY
