name: Range validation Dynamic200 retry
on:
  push:
    branches: [perf/range-validation-dynamic200]
    paths: [.github/workflows/range-validation-dynamic200-retry.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Reuse implementation patch
        run: |
          cp night.py /tmp/night_base.py
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/range-validation-dynamic200.yml').read_text()
          start=text.index('          from pathlib import Path\n')
          end=text.index('          PY\n      - name: Install tools', start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in text[start:end].splitlines())
          exec(compile(code, '<implementation-patch>', 'exec'))
          PY
      - run: |
          python -m pip install -q pytest 'uvicorn[standard]' blacksheep orjson
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
          PYTHONPATH=. pytest -q
      - name: Validation benchmark
        run: |
          python - <<'PY'
          import dataclasses, importlib.util, statistics, sys, time
          def load(path,name):
              spec=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(spec); sys.modules[name]=m; spec.loader.exec_module(m); return m
          base=load('/tmp/night_base.py','night_base'); fast=load('night.py','night_fast')
          @dataclasses.dataclass
          class Child: score:int; name:str
          @dataclasses.dataclass
          class Payload: id:int; title:str; active:bool; tags:list[str]; child:Child
          value={'id':42,'title':'x','active':True,'tags':['a','b','c'],'child':{'score':7,'name':'n'}}
          for m in (base,fast):
              for _ in range(1000): m._validate_dataclass(Payload,value)
          for m in (base,fast):
              runs=[]
              for _ in range(7):
                  t0=time.perf_counter()
                  for i in range(20000): m._validate_dataclass(Payload,value)
                  runs.append(20000/(time.perf_counter()-t0))
              print('VALIDATION',m.__name__,statistics.median(runs),'runs',runs)
          PY
      - name: Range smoke
        run: |
          cat > /tmp/range_app.py <<'PY'
          from night import Night, send_file
          app=Night().fast()
          @app.get('/file')
          def file(req): return send_file('/tmp/range-data.bin', req=req)
          PY
          printf '0123456789abcdefghijklmnopqrstuvwxyz' > /tmp/range-data.bin
          PYTHONPATH=. uvicorn --app-dir /tmp range_app:app --host 127.0.0.1 --port 8765 --no-access-log >/tmp/range.log 2>&1 & p=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/file >/dev/null 2>&1 && break; sleep .05; done
          test "$(curl -sS -H 'Range: bytes=10-14' -D /tmp/h1 http://127.0.0.1:8765/file)" = abcde
          grep -qi '^HTTP/1.1 206' /tmp/h1
          grep -qi '^content-range: bytes 10-14/36' /tmp/h1
          test "$(curl -sS -H 'Range: bytes=-4' http://127.0.0.1:8765/file)" = wxyz
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Range: bytes=999-' http://127.0.0.1:8765/file)" = 416
          kill -9 $p || true
      - name: Dynamic200
        run: |
          cat >/tmp/bench_night.py <<'PY'
          from night import Night
          app=Night().fast()
          @app.get('/items/<int:item_id>')
          def item(item_id:int): return {'id':item_id,'ok':True}
          PY
          cat >/tmp/bench_bs.py <<'PY'
          from blacksheep import Application, get, json
          app=Application()
          @get('/items/{item_id}')
          def item(item_id:int): return json({'id':item_id,'ok':True})
          PY
          mkdir -p /tmp/r
          bench(){ local fw=$1 mod=$2 n=$3; PYTHONPATH=. uvicorn --app-dir /tmp $mod:app --host 127.0.0.1 --port 8766 --workers 1 --no-access-log --loop uvloop --http httptools >/tmp/$fw.log 2>&1 & local p=$!; for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8766/items/42 >/dev/null 2>&1 && break; sleep .05; done; oha -n 2000 -c 200 --no-tui --output-format quiet http://127.0.0.1:8766/items/42 >/dev/null; oha -n 20000 -c 200 --no-tui --output-format json http://127.0.0.1:8766/items/42 >/tmp/r/$fw-$n.json; kill -9 $p 2>/dev/null || true; wait $p 2>/dev/null || true; }
          for n in 1 2 3 4 5 6; do if ((n%2)); then bench night bench_night $n; bench blacksheep bench_bs $n; else bench blacksheep bench_bs $n; bench night bench_night $n; fi; done
          python - <<'PY'
          import json,statistics
          for fw in ('night','blacksheep'):
              vals=[json.load(open(f'/tmp/r/{fw}-{i}.json'))['summary']['requestsPerSec'] for i in range(1,7)]
              lats=[json.load(open(f'/tmp/r/{fw}-{i}.json'))['summary']['average'] for i in range(1,7)]
              print('DYNAMIC200',fw,statistics.median(vals),statistics.median(lats),'runs',vals)
          PY
      - name: Commit core changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add night.py
          git commit -m 'add byte ranges and cache validation plans'
          git push origin HEAD:perf/range-validation-dynamic200
