name: Apply route-template perf patch

on:
  push:
    branches:
      - agent/perf-route-template
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/perf-route-template
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply patch
        run: python tools/apply_perf_patch.py

      - name: Install test dependencies
        run: python -m pip install -U pytest pytest-asyncio

      - name: Run tests
        run: PYTHONPATH=. pytest -q

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- night.py tests/test_fast_paths.py; then
            echo "No performance changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night.py tests/test_fast_paths.py
          git commit -m "optimize route registration and template rendering"
          git push origin HEAD:agent/perf-route-template
