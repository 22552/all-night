name: Midnight session access patch

on:
  push:
    branches:
      - feature/midnight-hardening
    paths:
      - tools/patch_midnight_session_access.py
      - .github/workflows/midnight-session-access-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/midnight-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Tighten Midnight cross-session access
        run: python tools/patch_midnight_session_access.py
      - name: Run focused tests
        run: python -m pytest tests/test_midnight.py -q
      - name: Commit patch
        run: |
          if git diff --quiet -- night_midnight.py tests/test_midnight.py; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night_midnight.py tests/test_midnight.py
          git commit -m "Tighten Midnight cross-session access"
          git push origin HEAD:feature/midnight-hardening
