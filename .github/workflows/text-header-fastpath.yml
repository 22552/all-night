name: Text header fast path
on:
  push:
    branches: [perf/text-response]
    paths: [.github/workflows/text-header-fastpath.yml]
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          python -m pip install -q 'uvicorn[standard]' pytest
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha && chmod +x /usr/local/bin/oha
      - name: Candidate
        run: |
          cp night.py night_baseline.py
          python - <<'PY'
          from pathlib import Path
          p=Path('night.py'); s=p.read_text()
          old='''class PlainTextResponse(Response):\n    def __init__(self, text: str, status: int = 200, headers: t.Mapping[str, str] | None = None):\n        if headers:\n            h = dict(headers)\n            h.setdefault("content-type", "text/plain; charset=utf-8")\n            super().__init__(body=text, status=status, headers=h)\n        else:\n            super().__init__(body=text, status=status, content_type="text/plain; charset=utf-8")\n'''
          new='''class PlainTextResponse(Response):\n    _content_type = "text/plain; charset=utf-8"\n    _content_type_header = (b"content-type", b"text/plain; charset=utf-8")\n\n    def __init__(self, text: str, status: int = 200, headers: t.Mapping[str, str] | None = None):\n        if headers:\n            h = dict(headers)\n            h.setdefault("content-type", self._content_type)\n            super().__init__(body=text, status=status, headers=h)\n        else:\n            super().__init__(body=text, status=status, content_type=self._content_type)\n\n    def asgi_headers(self) -> list[tuple[bytes, bytes]]:\n        h = self.headers\n        if (not self.raw_headers and len(h) == 3 and h.get("content-type") == self._content_type\n                and "date" in h and "content-length" in h):\n            return [\n                self._content_type_header,\n                (b"date", h["date"].encode("latin-1")),\n                (b"content-length", h["content-length"].encode("latin-1")),\n            ]\n        return super().asgi_headers()\n'''
          if old not in s: raise SystemExit('target missing')
          p.write_text(s.replace(old,new))
          PY
          PYTHONPATH=. pytest -q
          python - <<'PY'
          import timeit,statistics
          from night_baseline import PlainTextResponse as B
          from night import PlainTextResponse as F
          b=B('hello world');f=F('hello world')
          for obj,name in [(b,'base'),(f,'fast')]:
            vals=timeit.repeat(obj.asgi_headers,number=500000,repeat=7)
            med=statistics.median(vals)
            print(name,'ns/asgi_headers',med/500000*1e9)
          PY
      - name: HTTP
        run: |
          cat > base_app.py <<'PY'
          from night_baseline import Night
          app=Night().fast()
          @app.get('/')
          def root(): return 'hello world'
          PY
          cat > fast_app.py <<'PY'
          from night import Night
          app=Night().fast()
          @app.get('/')
          def root(): return 'hello world'
          PY
          set -euo pipefail; mkdir -p r
          bench(){ n=$1 m=$2 i=$3; uvicorn $m:app --host 127.0.0.1 --port 8761 --no-access-log --loop uvloop --http httptools >/tmp/$n 2>&1 & p=$!; for x in $(seq 1 50); do curl -fsS http://127.0.0.1:8761/ >/dev/null 2>&1 && break; sleep .05; done; timeout 8s oha -n 1000 -c 50 --no-tui --output-format quiet http://127.0.0.1:8761/ >/dev/null; timeout 8s oha -n 10000 -c 50 --no-tui --output-format json http://127.0.0.1:8761/ >r/$n-$i.json; kill -9 $p || true; wait $p 2>/dev/null || true; sleep .05; }
          for i in 1 2 3 4 5 6; do if ((i%2)); then bench base base_app $i; bench fast fast_app $i; else bench fast fast_app $i; bench base base_app $i; fi; done
          python - <<'PY'
          import json,statistics
          b=[json.load(open(f'r/base-{i}.json'))['summary']['requestsPerSec'] for i in range(1,7)]
          f=[json.load(open(f'r/fast-{i}.json'))['summary']['requestsPerSec'] for i in range(1,7)]
          bm,fm=statistics.median(b),statistics.median(f)
          print('base',bm,b);print('fast',fm,f);print('delta',(fm/bm-1)*100);print('ratio',fm/bm)
          PY