name: Text fast path experiment
on:
  push:
    branches: [perf/text-response]
    paths: [.github/workflows/text-fastpath-experiment.yml]
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install -U 'uvicorn[standard]' pytest
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
      - name: Patch candidate
        run: |
          cp night.py night_baseline.py
          python - <<'PY'
          from pathlib import Path
          p=Path('night.py'); s=p.read_text()
          old='''class PlainTextResponse(Response):\n    def __init__(self, text: str, status: int = 200, headers: t.Mapping[str, str] | None = None):\n        if headers:\n            h = dict(headers)\n            h.setdefault("content-type", "text/plain; charset=utf-8")\n            super().__init__(body=text, status=status, headers=h)\n        else:\n            super().__init__(body=text, status=status, content_type="text/plain; charset=utf-8")\n'''
          new='''class PlainTextResponse(Response):\n    __slots__ = ()\n\n    def __init__(self, text: str, status: int = 200, headers: t.Mapping[str, str] | None = None):\n        self.status = int(status)\n        self.body = text.encode("utf-8")\n        if headers:\n            h = {k.lower(): v for k, v in headers.items()}\n            h.setdefault("content-type", "text/plain; charset=utf-8")\n            h.setdefault("date", _cached_http_date())\n            h.setdefault("content-length", str(len(self.body)))\n            self.headers = h\n        else:\n            self.headers = {\n                "content-type": "text/plain; charset=utf-8",\n                "date": _cached_http_date(),\n                "content-length": str(len(self.body)),\n            }\n        self.raw_headers = []\n'''
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new))
          PY
          python -m py_compile night.py
          PYTHONPATH=. pytest -q
      - name: Apps
        run: |
          cat > bench_base.py <<'PY'
          from night_baseline import Night
          app=Night().fast()
          @app.get('/')
          def root(): return 'hello world'
          PY
          cat > bench_fast.py <<'PY'
          from night import Night
          app=Night().fast()
          @app.get('/')
          def root(): return 'hello world'
          PY
      - name: Benchmark
        run: |
          set -euo pipefail; mkdir -p results
          bench(){ name=$1 mod=$2 run=$3; uvicorn $mod:app --host 127.0.0.1 --port 8740 --workers 1 --no-access-log --loop uvloop --http httptools >/tmp/$name.log 2>&1 & pid=$!; for i in $(seq 1 100); do curl -fsS http://127.0.0.1:8740/ >/dev/null 2>&1 && break; sleep .1; done; oha -n 1500 -c 50 --no-tui --output-format quiet http://127.0.0.1:8740/ >/dev/null; oha -n 16000 -c 50 --no-tui --output-format json http://127.0.0.1:8740/ > results/$name-$run.json; kill -9 $pid 2>/dev/null || true; wait $pid 2>/dev/null || true; sleep .1; }
          for r in 1 2 3 4 5 6; do if ((r%2)); then bench base bench_base $r; bench fast bench_fast $r; else bench fast bench_fast $r; bench base bench_base $r; fi; done
          python - <<'PY'
          import json,statistics
          b=[json.load(open(f'results/base-{r}.json'))['summary']['requestsPerSec'] for r in range(1,7)]
          f=[json.load(open(f'results/fast-{r}.json'))['summary']['requestsPerSec'] for r in range(1,7)]
          bm,fm=statistics.median(b),statistics.median(f)
          print('baseline',bm,b); print('candidate',fm,f); print('delta_percent',(fm/bm-1)*100); print('ratio',fm/bm)
          PY