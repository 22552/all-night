name: FastNight benchmark

on:
  push:
    branches:
      - fastNight
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runtime
        run: |
          python -m pip install uvicorn
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha

      - name: Create benchmark apps
        run: |
          cat > bench_night.py <<'PY'
          from night import Night
          app = Night()
          @app.get('/')
          async def root():
              return {'message': 'hello'}
          @app.get('/users/<int:user_id>')
          async def user(user_id: int):
              return {'id': user_id}
          PY

          cat > bench_fastnight.py <<'PY'
          from fastnight import FastNight
          app = FastNight()
          @app.get('/')
          async def root():
              return {'message': 'hello'}
          @app.get('/users/<int:user_id>')
          async def user(user_id: int):
              return {'id': user_id}
          PY

      - name: Run HTTP benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-results

          wait_ready() {
            local url="$1"
            for i in $(seq 1 100); do
              if curl -fsS "$url" >/dev/null 2>&1; then return 0; fi
              sleep 0.1
            done
            return 1
          }

          bench() {
            local name="$1" module="$2" port="$3"
            uvicorn "$module:app" --host 127.0.0.1 --port "$port" --workers 1 --no-access-log >"bench-results/${name}-server.log" 2>&1 &
            local pid=$!
            wait_ready "http://127.0.0.1:${port}/"
            timeout 10s oha -n 200 -c 25 --no-tui --output-format quiet "http://127.0.0.1:${port}/" >/dev/null
            for endpoint in static dynamic; do
              if [[ "$endpoint" == static ]]; then path='/'; else path='/users/42'; fi
              for run in 1 2 3; do
                timeout 10s oha -n 2000 -c 50 --no-tui --output-format json \
                  "http://127.0.0.1:${port}${path}" > "bench-results/${name}-${endpoint}-${run}.json"
              done
            done
            kill -9 "$pid" 2>/dev/null || true
          }

          bench night bench_night 8011
          bench fastnight bench_fastnight 8012

      - name: Run Python microbenchmarks
        run: |
          python - <<'PY' | tee bench-results/python-microbench.txt
          import gc
          import statistics
          import time
          from night import Night, TemplateEngine
          from fastnight import FastNight, FastTemplateEngine

          # Build Night template delimiters without spelling the GitHub Actions
          # expression opener in this workflow source.
          E = '$' + '{{'
          T = '$' + '{%'
          TEMPLATE = (
              '<h1>' + E + ' title }}</h1>\n'
              + T + ' if user.admin %}<b>' + E + ' user.name }}</b>'
              + T + ' else %}' + E + ' user.name }}' + T + ' endif %}\n'
              + '<ul>' + T + ' for item in items %}<li>' + E + ' item }}</li>'
              + T + ' endfor %}</ul>'
          )
          CONTEXT = {
              'title': 'Night',
              'user': {'name': 'alice', 'admin': True},
              'items': list(range(10)),
          }

          def measure(fn, repeat=7):
              values=[]
              for _ in range(repeat):
                  gc.collect()
                  start=time.perf_counter()
                  fn()
                  values.append(time.perf_counter()-start)
              return statistics.median(values)

          normal_engine=TemplateEngine()
          fast_engine=FastTemplateEngine()
          normal_template=normal_engine.compile(TEMPLATE)
          fast_template=fast_engine.compile(TEMPLATE)

          expected=normal_template.render(CONTEXT)
          actual=fast_template.render(CONTEXT)
          assert actual == expected, (expected, actual)

          N=10000
          t_normal=measure(lambda: [normal_template.render(CONTEXT) for _ in range(N)])
          t_fast=measure(lambda: [fast_template.render(CONTEXT) for _ in range(N)])
          print('## template render')
          print(f'night: {N/t_normal:.1f} renders/s ({t_normal:.4f}s)')
          print(f'fastnight: {N/t_fast:.1f} renders/s ({t_fast:.4f}s)')
          print(f'gain: {(t_normal/t_fast-1)*100:+.1f}%')

          ROUTES=500
          def build_normal():
              app=Night()
              for i in range(ROUTES):
                  app.get(f'/r{i}/<int:value>')(lambda value: value)
          def build_fast():
              app=FastNight()
              for i in range(ROUTES):
                  app.get(f'/r{i}/<int:value>')(lambda value: value)

          r_normal=measure(build_normal, repeat=5)
          r_fast=measure(build_fast, repeat=5)
          print('## dynamic route registration')
          print(f'night: {ROUTES/r_normal:.1f} routes/s ({r_normal:.4f}s)')
          print(f'fastnight: {ROUTES/r_fast:.1f} routes/s ({r_fast:.4f}s)')
          print(f'gain: {(r_normal/r_fast-1)*100:+.1f}%')
          PY

      - name: Summarize HTTP
        run: |
          python - <<'PY'
          import glob, json, statistics
          for endpoint in ('static', 'dynamic'):
              print(f'## {endpoint}')
              values = {}
              for fw in ('night', 'fastnight'):
                  rps=[]; lat=[]
                  for f in sorted(glob.glob(f'bench-results/{fw}-{endpoint}-*.json')):
                      d=json.load(open(f))
                      rps.append(d['summary']['requestsPerSec'])
                      lat.append(d['summary']['average'] * 1000)
                  values[fw]=(statistics.mean(rps), statistics.mean(lat), rps)
                  print(f"{fw}: {values[fw][0]:.1f} req/s, {values[fw][1]:.3f} ms; runs=" + ', '.join(f'{x:.1f}' for x in rps))
              gain=(values['fastnight'][0]/values['night'][0]-1)*100
              print(f'gain: {gain:+.1f}%')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: fastnight-benchmark-results
          path: bench-results/
