name: Compare Hotpath Round2
on:
  push:
    branches: ["perf/hotpath-round2"]
    paths: [".github/workflows/compare-hotpath-round2.yml"]
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare main and branch
        run: |
          git show origin/main:night.py > /tmp/night_main.py
          python - <<'PY'
          import importlib.util, statistics, sys, time
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path); m=importlib.util.module_from_spec(spec); sys.modules[name]=m; spec.loader.exec_module(m); return m
          base=load('night_base2','/tmp/night_main.py'); opt=load('night_opt2','night.py')
          def med(fn,n=100000,r=9):
              xs=[]
              for _ in range(r):
                  t=time.perf_counter_ns()
                  for _ in range(n): fn()
                  xs.append((time.perf_counter_ns()-t)/n)
              return statistics.median(xs)
          def show(name,a,b): print(name, f'main={a:.1f}', f'branch={b:.1f}', f'speedup={a/b:.3f}x')

          show('Response()', med(lambda: base.Response('ok'),30000), med(lambda: opt.Response('ok'),30000))

          hs=[(f'x-{i}'.encode(),str(i).encode()) for i in range(20)] + [(b'content-type',b'application/json'),(b'cookie',b'a=b')]
          qb=base.Request({'headers':hs},lambda:None,lambda e:None); qo=opt.Request({'headers':hs},lambda:None,lambda e:None)
          # fresh object each time so cache does not hide first lookup cost
          show('header first lookup', med(lambda: base.Request({'headers':hs},lambda:None,lambda e:None).header('content-type'),30000), med(lambda: opt.Request({'headers':hs},lambda:None,lambda e:None).header('content-type'),30000))
          # repeated lookup on same request
          qb.header('content-type'); qo.header('content-type')
          show('header cached lookup', med(lambda: qb.header('content-type')), med(lambda: qo.header('content-type')))

          ba=base.Night(); oa=opt.Night()
          for i in range(200):
              ba.get(f'/s/{i}')(lambda i=i: str(i)); oa.get(f'/s/{i}')(lambda i=i: str(i))
          show('_match_method static', med(lambda: ba._match_method('/s/199','GET')), med(lambda: oa._match_method('/s/199','GET')))
          PY
