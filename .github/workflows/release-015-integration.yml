name: 0.1.5 integration

on:
  push:
    branches: [perf/response-fastpath]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/response-fastpath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply 0.1.5 runtime and docs patches
        run: |
          python tools/release_015_patch.py
          python tools/docs_015_patch.py
      - name: Test runtime
        run: |
          python -m pip install -U pytest build twine
          PYTHONPATH=. pytest -q
      - name: Build core and Midnight distributions
        run: |
          rm -rf dist
          python -m build --outdir dist .
          python -m build --wheel --outdir dist packages/midnight
          twine check dist/*
      - name: Verify wheel boundaries
        run: |
          python - <<'PY'
          import glob, zipfile
          core = next(p for p in glob.glob('dist/all_night-0.1.5-*.whl') if 'midnight' not in p)
          midnight = next(p for p in glob.glob('dist/all_night_midnight-0.1.5-*.whl'))
          with zipfile.ZipFile(core) as z:
              names = set(z.namelist())
              assert not any(n.startswith('night_midnight') for n in names), sorted(n for n in names if 'midnight' in n)
              assert 'night.py' in names
              assert 'night_cloudflare.py' in names
          with zipfile.ZipFile(midnight) as z:
              names = set(z.namelist())
              for name in ('night_midnight.py','night_midnight_component.py','night_midnight_dev.py','night_midnight_form.py'):
                  assert name in names, (name, sorted(names))
          print('wheel split OK')
          PY
      - name: Install standard profile from local wheels
        run: |
          python -m pip install --force-reinstall --find-links dist 'all-night[standard]==0.1.5'
          python - <<'PY'
          from night import Night
          import night_midnight, night_midnight_dev, night_cloudflare
          app = Night().fast()
          assert app._fast_mode
          print('standard profile OK')
          PY
      - name: Commit generated 0.1.5 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add night.py tests/test_fast_mode.py docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'add fast runtime profile and 0.1.5 docs'
          git push origin HEAD:perf/response-fastpath
