name: Optimize Dynamic Routing

on:
  push:
    branches: ["perf/dynamic-4digit"]
    paths:
      - "tools/optimize_dynamic.py"
      - ".github/workflows/optimize-dynamic.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/dynamic-4digit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply optimization
        run: python tools/optimize_dynamic.py
      - name: Validate syntax
        run: python -m py_compile night.py
      - name: Run tests and capture failures
        run: |
          python -m pip install pytest
          set +e
          python -m pytest -q tests > /tmp/pytest.log 2>&1
          code=$?
          set -e
          cat /tmp/pytest.log
          if [ "$code" -ne 0 ]; then
            cp /tmp/pytest.log pytest-debug.txt
          fi
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f pytest-debug.txt ]; then
            git add pytest-debug.txt
            git commit -m "Capture dynamic optimizer test failure"
          else
            git add night.py
            git commit -m "Optimize dynamic routing hot path"
          fi
          git push origin HEAD:perf/dynamic-4digit
