name: Optimize Dynamic Routing

on:
  push:
    branches: ["perf/dynamic-4digit"]
    paths:
      - "tools/optimize_dynamic.py"
      - ".github/workflows/optimize-dynamic.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/dynamic-4digit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply optimization
        run: python tools/optimize_dynamic.py
      - name: Validate syntax
        run: python -m py_compile night.py
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests
      - name: Commit optimized Night
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night.py
          git commit -m "Optimize dynamic routing hot path"
          git push origin HEAD:perf/dynamic-4digit
