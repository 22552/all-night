name: Apply Terminal Dynamic Hash

on:
  push:
    branches: ["perf/dynamic-200-hash"]
    paths:
      - "tools/apply_terminal_dynamic_hash.py"
      - ".github/workflows/apply-terminal-dynamic-hash.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/dynamic-200-hash
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply optimization
        run: python tools/apply_terminal_dynamic_hash.py
      - name: Validate
        run: |
          python -m py_compile night.py
          python -m pip install pytest Flask robyn bottle WebTest fastapi httpx microdot
          python -m pytest -q tests
          python benchmarks/fast_path.py
          cd deploy/cloudflare-night
          npm run build
          python -m py_compile src/night.py src/entry.py
      - name: Commit optimized Night
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night.py
          git commit -m "Compile terminal dynamic route prefixes"
          git push origin HEAD:perf/dynamic-200-hash
