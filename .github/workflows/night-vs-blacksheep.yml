name: Night vs BlackSheep benchmark
on:
  push:
    branches: [bench/night-vs-blacksheep]
    paths: [.github/workflows/night-vs-blacksheep.yml]
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: |
          python -m pip install -q 'uvicorn[standard]' blacksheep orjson
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
      - name: Apps
        run: |
          cat > bench_night.py <<'PY'
          from night import Night
          app=Night().fast()
          @app.get('/text')
          def text_route(): return 'hello world'
          @app.get('/json')
          def json_route(): return {'ok':True,'name':'night','n':42}
          @app.get('/users/<int:user_id>')
          def dynamic_route(user_id:int): return {'id':user_id,'ok':True}
          @app.post('/echo')
          async def echo(req): return await req.json()
          PY
          cat > bench_bs.py <<'PY'
          from blacksheep import Application, json, text
          app=Application()
          @app.router.get('/text')
          async def text_route(): return text('hello world')
          @app.router.get('/json')
          async def json_route(): return json({'ok':True,'name':'night','n':42})
          @app.router.get('/users/{user_id:int}')
          async def dynamic_route(user_id:int): return json({'id':user_id,'ok':True})
          @app.router.post('/echo')
          async def echo(request):
              data=await request.json()
              return json(data)
          PY
      - name: Benchmark
        run: |
          set -euo pipefail
          mkdir -p r
          bench(){ fw=$1 mod=$2 ep=$3 method=$4 run=$5; uvicorn $mod:app --host 127.0.0.1 --port 8764 --workers 1 --no-access-log --loop uvloop --http httptools >/tmp/$fw.log 2>&1 & p=$!; for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8764/text >/dev/null 2>&1 && break; sleep .05; done; if [ "$method" = POST ]; then oha -n 1000 -c 50 -m POST -H 'content-type: application/json' -d '{"hello":"world","n":123}' --no-tui --output-format quiet http://127.0.0.1:8764$ep >/dev/null; oha -n 10000 -c 50 -m POST -H 'content-type: application/json' -d '{"hello":"world","n":123}' --no-tui --output-format json http://127.0.0.1:8764$ep > r/$fw-$run.json; else oha -n 1000 -c 50 --no-tui --output-format quiet http://127.0.0.1:8764$ep >/dev/null; oha -n 10000 -c 50 --no-tui --output-format json http://127.0.0.1:8764$ep > r/$fw-$run.json; fi; kill -9 $p 2>/dev/null || true; wait $p 2>/dev/null || true; sleep .05; }
          for case in 'text /text GET' 'json /json GET' 'dynamic /users/42 GET' 'post /echo POST'; do set -- $case; label=$1; ep=$2; method=$3; for run in 1 2 3 4 5 6; do if ((run%2)); then bench night bench_night $ep $method ${label}-$run; bench blacksheep bench_bs $ep $method ${label}-$run; else bench blacksheep bench_bs $ep $method ${label}-$run; bench night bench_night $ep $method ${label}-$run; fi; done; done
          python - <<'PY'
          import json,statistics
          for label in ['text','json','dynamic','post']:
              print('\nCASE',label)
              for fw in ['night','blacksheep']:
                  vals=[json.load(open(f'r/{fw}-{label}-{i}.json'))['summary']['requestsPerSec'] for i in range(1,7)]
                  lats=[json.load(open(f'r/{fw}-{label}-{i}.json'))['summary']['average'] for i in range(1,7)]
                  print(fw,'req/s',statistics.median(vals),'lat',statistics.median(lats),'runs',vals)
          PY
