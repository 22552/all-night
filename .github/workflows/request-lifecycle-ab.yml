name: Request Lifecycle A/B
on:
  push:
    branches: ["perf/request-lifecycle"]
    paths:
      - "tools/request_lifecycle_ab.py"
      - ".github/workflows/request-lifecycle-ab.yml"
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/request_lifecycle_ab.py
