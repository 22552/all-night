name: Compare Prebound Calls

on:
  push:
    branches: ["perf/prebound-route-calls"]
    paths:
      - ".github/workflows/compare-prebound-calls.yml"

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compare main and branch in one process
        run: |
          git show origin/main:night.py > /tmp/night_main.py
          python - <<'PY'
          import asyncio, importlib.util, statistics, sys, time

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              sys.modules[name] = mod
              spec.loader.exec_module(mod)
              return mod

          base = load("night_main_calls", "/tmp/night_main.py")
          opt = load("night_opt_calls", "night.py")

          async def recv():
              return {"type": "http.request", "body": b"", "more_body": False}

          def req(mod, path):
              return mod.Request(scope={"type":"http","http_version":"1.1","method":"GET","scheme":"http","path":path,"raw_path":path.encode(),"query_string":b"","headers":[],"server":("bench",80),"client":None}, receive=recv, send=None)

          def handler_for(value):
              def handler(id: int): return {"route": value, "id": id}
              return handler

          def build(mod, many):
              app = mod.Night()
              for i in range(200): app.get(f"/static/{i}")(lambda i=i: str(i))
              @app.get("/users/<int:id>")
              def user(id: int): return {"id": id}
              if many:
                  for i in range(200): app.get(f"/dynamic/{i}/<int:id>")(handler_for(i))
              return app

          async def one(app, request, path, iterations=12000):
              route, params = app._match_method(path, "GET")
              start = time.perf_counter_ns()
              for _ in range(iterations):
                  await app._call_route(route, request, params)
              return (time.perf_counter_ns()-start)/iterations

          async def main():
              for path, many in (("/static/199",False),("/users/42",False),("/dynamic/199/42",True)):
                  ba, oa = build(base,many), build(opt,many)
                  br, orq = req(base,path), req(opt,path)
                  bs=[await one(ba,br,path) for _ in range(9)]
                  os=[await one(oa,orq,path) for _ in range(9)]
                  b,o=statistics.median(bs),statistics.median(os)
                  print(path)
                  print(f"  main   {b:.1f} ns/op")
                  print(f"  branch {o:.1f} ns/op")
                  print(f"  speedup {b/o:.3f}x")
          asyncio.run(main())
          PY
