name: Apply file gzip chain patch

on:
  push:
    branches:
      - agent/file-gzip-chain

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/file-gzip-chain
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply file gzip chain patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("night.py")
          source = path.read_text()

          def replace_once(old: str, new: str):
              global source
              if old not in source:
                  if new in source:
                      return
                  raise SystemExit(f"patch target not found: {old[:120]!r}")
              if source.count(old) != 1:
                  raise SystemExit(f"patch target is ambiguous: {old[:120]!r}")
              source = source.replace(old, new, 1)

          replace_once("import email.utils\nimport hashlib\n", "import email.utils\nimport gzip\nimport hashlib\n")
          replace_once("import re\nimport sys\n", "import re\nimport shutil\nimport sys\n")

          replace_once(
              "    send: t.Callable\n\n    _body: bytes | None = None\n",
              "    send: t.Callable\n    app: t.Any = None\n\n    _body: bytes | None = None\n",
          )

          marker = "\n\n# ----------------------------\n# Routing\n# ----------------------------\n"
          if "class FileHandler:" not in source:
              insert = dedent('''\


          _GZIP_CACHE_DIR = os.path.join(tempfile.gettempdir(), "night-gzip-cache")


          def _gzip_cached_file(path: str, level: int = 6) -> tuple[str, str, os.stat_result]:
              """Return a temp-cached gzip representation for a source file."""
              level = int(level)
              if not 0 <= level <= 9:
                  raise ValueError("gzip level must be between 0 and 9")

              source_path = os.path.abspath(os.fspath(path))
              st = os.stat(source_path)
              cache_key = hashlib.sha256(
                  f"{source_path}\\0{st.st_mtime_ns}\\0{st.st_size}\\0{level}".encode("utf-8")
              ).hexdigest()
              os.makedirs(_GZIP_CACHE_DIR, exist_ok=True)
              cached_path = os.path.join(_GZIP_CACHE_DIR, cache_key + ".gz")
              if os.path.isfile(cached_path):
                  return cached_path, cache_key, st

              temp_path = cached_path + f".{os.getpid()}.{time.time_ns()}.tmp"
              try:
                  with open(source_path, "rb") as src, open(temp_path, "wb") as raw_dst:
                      with gzip.GzipFile(
                          filename="",
                          mode="wb",
                          fileobj=raw_dst,
                          compresslevel=level,
                          mtime=0,
                      ) as dst:
                          shutil.copyfileobj(src, dst, length=1024 * 1024)
                  os.replace(temp_path, cached_path)
                  try:
                      os.utime(cached_path, ns=(st.st_atime_ns, st.st_mtime_ns))
                  except OSError:
                      pass
              finally:
                  try:
                      if os.path.exists(temp_path):
                          os.unlink(temp_path)
                  except OSError:
                      pass
              return cached_path, cache_key, st


          class FileHandler:
              """Lazy, chainable file response builder returned by send_file()."""

              def __init__(
                  self,
                  path: str,
                  *,
                  req: Request | None = None,
                  status: int = 200,
                  headers: t.Mapping[str, str] | None = None,
                  download_name: str | None = None,
                  cache_seconds: int | None = 3600,
              ):
                  self.path = os.fspath(path)
                  self.req = req
                  self.status = int(status)
                  self.headers = dict(headers or {})
                  self.download_name = download_name
                  self.cache_seconds = cache_seconds
                  self._gzip: bool | None = None
                  self._gzip_level: int | None = None

              def gz(self, level: int | None = None):
                  """Serve this file as an HTTP gzip-encoded representation."""
                  if level is not None:
                      level = int(level)
                      if not 0 <= level <= 9:
                          raise ValueError("gzip level must be between 0 and 9")
                  self._gzip = True
                  self._gzip_level = level
                  return self

              def raw(self):
                  """Disable app-level gzip for this file."""
                  self._gzip = False
                  return self

              def _gzip_settings(self, req: Request | None) -> tuple[bool, int]:
                  app = getattr(req, "app", None) if req is not None else None
                  app_enabled = bool(getattr(app, "_file_gzip_enabled", False))
                  app_level = int(getattr(app, "_file_gzip_level", 6))
                  if self._gzip is False:
                      return False, app_level
                  if self._gzip is True:
                      return True, self._gzip_level if self._gzip_level is not None else app_level
                  return app_enabled, app_level

              def response(self, req: Request | None = None) -> FileResponse:
                  req = req or self.req
                  use_gzip, level = self._gzip_settings(req)
                  if not use_gzip:
                      return FileResponse(
                          self.path,
                          req=req,
                          status=self.status,
                          headers=self.headers,
                          download_name=self.download_name,
                          cache_seconds=self.cache_seconds,
                      )

                  cached_path, cache_key, st = _gzip_cached_file(self.path, level)
                  h = dict(self.headers)
                  h.setdefault("content-type", _guess_content_type(self.path))
                  h.setdefault("content-encoding", "gzip")
                  h.setdefault("vary", "Accept-Encoding")
                  h.setdefault("etag", f'W/"gz-{cache_key[:16]}"')
                  mtime = _dt.datetime.fromtimestamp(st.st_mtime, tz=_dt.timezone.utc)
                  h.setdefault("last-modified", _http_date(mtime))
                  return FileResponse(
                      cached_path,
                      req=req,
                      status=self.status,
                      headers=h,
                      download_name=self.download_name,
                      cache_seconds=self.cache_seconds,
                  )

              def __call__(self, req: Request | None = None) -> FileResponse:
                  return self.response(req)
          ''')
              if marker not in source:
                  raise SystemExit("routing marker not found")
              source = source.replace(marker, insert + marker, 1)

          replace_once(
              "        self._endpoint_plans: dict[t.Callable, _EndpointPlan] = {}\n        if css: self.enable_css(minify=css_minify)\n",
              "        self._endpoint_plans: dict[t.Callable, _EndpointPlan] = {}\n        self._file_gzip_enabled = False\n        self._file_gzip_level = 6\n        if css: self.enable_css(minify=css_minify)\n",
          )

          replace_once(
              "    def test_client(self) -> TestClient:\n        return TestClient(self)\n",
              dedent('''\
              def gz(self, level: int = 6):
                  """Enable gzip by default for send_file() and static() responses."""
                  level = int(level)
                  if not 0 <= level <= 9:
                      raise ValueError("gzip level must be between 0 and 9")
                  self._file_gzip_enabled = True
                  self._file_gzip_level = level
                  return self

              def test_client(self) -> TestClient:
                  return TestClient(self)
              ''').replace("\ndef gz", "\n    def gz").replace("\ndef test_client", "\n    def test_client").replace("\n    \"\"\"Enable", "\n        \"\"\"Enable").replace("\n    level =", "\n        level =").replace("\n    if not", "\n        if not").replace("\n        raise", "\n            raise").replace("\n    self._file", "\n        self._file").replace("\n    return self", "\n        return self").replace("\n    return TestClient", "\n        return TestClient"),
          )

          replace_once(
              "    def _coerce_response(self, value: t.Any) -> Response:\n        kind = type(value)\n",
              "    def _coerce_response(self, value: t.Any) -> Response:\n        if isinstance(value, FileHandler):\n            return value.response(request())\n        kind = type(value)\n",
          )

          replace_once(
              "        req = Request(scope=request_scope, receive=receive, send=send, max_body_size=self.max_body_size)\n",
              "        req = Request(scope=request_scope, receive=receive, send=send, app=self, max_body_size=self.max_body_size)\n",
          )

          old_send_file = dedent('''\
          def send_file(
              path: str,
              *,
              req: Request | None = None,
              status: int = 200,
              headers: dict[str, str] | None = None,
              download_name: str | None = None,
              cache_seconds: int | None = 3600,
          ) -> FileResponse:
              return FileResponse(
                  path,
                  req=req,
                  status=status,
                  headers=headers,
                  download_name=download_name,
                  cache_seconds=cache_seconds,
              )
          ''')
          new_send_file = dedent('''\
          def send_file(
              path: str,
              *,
              req: Request | None = None,
              status: int = 200,
              headers: dict[str, str] | None = None,
              download_name: str | None = None,
              cache_seconds: int | None = 3600,
          ) -> FileHandler:
              """Build a lazy file handler that can be returned or registered directly."""
              return FileHandler(
                  path,
                  req=req,
                  status=status,
                  headers=headers,
                  download_name=download_name,
                  cache_seconds=cache_seconds,
              )
          ''')
          replace_once(old_send_file, new_send_file)

          replace_once(
              "        return FileResponse(full, req=req, cache_seconds=cache_seconds)\n",
              "        return send_file(full, req=req, cache_seconds=cache_seconds)\n",
          )

          path.write_text(source)

          Path("tests/test_file_gzip_chain.py").write_text(dedent('''\
          import gzip
          import os

          from night import Night, _gzip_cached_file, send_file


          def test_send_file_can_be_registered_directly_and_returned(tmp_path):
              source = tmp_path / "hello.txt"
              source.write_text("hello night")

              app = Night()
              app.get("/direct", send_file(str(source)))

              @app.get("/returned")
              def returned():
                  return send_file(str(source))

              with app.test_client() as client:
                  direct = client.get("/direct")
                  returned_response = client.get("/returned")

              assert direct.text == "hello night"
              assert returned_response.text == "hello night"
              assert "content-encoding" not in direct.headers
              assert "content-encoding" not in returned_response.headers


          def test_file_gzip_chain_global_default_and_raw_override(tmp_path):
              payload = ("Night gzip chain!" * 256).encode()
              source = tmp_path / "payload.txt"
              source.write_bytes(payload)

              app = Night()
              app.get("/forced", send_file(str(source)).gz())
              app.gz(9)
              app.get("/global", send_file(str(source)))
              app.get("/raw", send_file(str(source)).raw())

              @app.get("/returned")
              def returned():
                  return send_file(str(source))

              with app.test_client() as client:
                  forced = client.get("/forced")
                  global_default = client.get("/global")
                  raw = client.get("/raw")
                  returned_response = client.get("/returned")

              for response in (forced, global_default, returned_response):
                  assert response.headers["content-encoding"] == "gzip"
                  assert response.headers["content-type"].startswith("text/plain")
                  assert gzip.decompress(response.data) == payload

              assert "content-encoding" not in raw.headers
              assert raw.data == payload


          def test_gzip_temp_cache_reuses_and_invalidates_by_source_metadata(tmp_path):
              source = tmp_path / "cache.txt"
              source.write_bytes(b"a" * 4096)

              first, first_key, _ = _gzip_cached_file(str(source), 6)
              second, second_key, _ = _gzip_cached_file(str(source), 6)
              assert first == second
              assert first_key == second_key
              assert os.path.isfile(first)
              assert gzip.decompress(open(first, "rb").read()) == b"a" * 4096

              source.write_bytes(b"b" * 4097)
              third, third_key, _ = _gzip_cached_file(str(source), 6)
              assert third != first
              assert third_key != first_key
              assert gzip.decompress(open(third, "rb").read()) == b"b" * 4097
          '''))
          PY
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_file_gzip_chain.py tests/test_route_registration_styles.py tests/test_route_invoke.py
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Check diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add night.py tests/test_file_gzip_chain.py
          git diff --cached --quiet && exit 0
          git commit -m "Add chainable gzip file handlers"
          git push origin HEAD:agent/file-gzip-chain
