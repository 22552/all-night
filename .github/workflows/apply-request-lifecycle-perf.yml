name: Apply Request Lifecycle Perf

on:
  push:
    branches: ["perf/request-lifecycle"]
    paths:
      - "tools/apply_request_lifecycle_perf.py"
      - ".github/workflows/apply-request-lifecycle-perf.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply optimization
        run: python tools/apply_request_lifecycle_perf.py
      - name: Validate
        run: |
          python -m py_compile night.py
          python -m pip install pytest Flask robyn
          python -m pytest -q tests
          python benchmarks/fast_path.py
          cd deploy/cloudflare-night
          npm run build
          python -m py_compile src/night.py src/entry.py
      - name: Commit optimized Night
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night.py
          git commit -m "Optimize request lifecycle hot path"
          git push origin HEAD:perf/request-lifecycle
