name: Request response hotpath

on:
  push:
    branches: [perf/request-response-hotpath]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-response-hotpath
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: |
          python -m pip install -U pytest uvicorn
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
      - name: Load main baseline
        run: |
          git fetch origin main --depth=1
          git show origin/main:night.py > /tmp/night_baseline.py
      - name: Test fast branch
        run: PYTHONPATH=. pytest -q
      - name: Create A/B apps
        run: |
          cat > bench_baseline_night.py <<'PY'
          import importlib.util, sys
          spec=importlib.util.spec_from_file_location('night_baseline_http','/tmp/night_baseline.py')
          night=importlib.util.module_from_spec(spec); sys.modules['night_baseline_http']=night; spec.loader.exec_module(night)
          app=night.Night()
          @app.get('/')
          async def root(): return {'message':'hello'}
          @app.get('/users/<int:user_id>')
          async def user(user_id:int): return {'id':user_id}
          PY
          cat > bench_fast_night.py <<'PY'
          from night import Night
          app=Night()
          @app.get('/')
          async def root(): return {'message':'hello'}
          @app.get('/users/<int:user_id>')
          async def user(user_id:int): return {'id':user_id}
          PY
      - name: Run interleaved same-runner HTTP A/B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-results
          wait_ready() { local u="$1"; for i in $(seq 1 100); do curl -fsS "$u" >/dev/null 2>&1 && return 0; sleep 0.1; done; return 1; }
          uvicorn bench_baseline_night:app --host 127.0.0.1 --port 8001 --workers 1 --no-access-log >bench-results/baseline-server.log 2>&1 &
          BPID=$!
          uvicorn bench_fast_night:app --host 127.0.0.1 --port 8002 --workers 1 --no-access-log >bench-results/fast-server.log 2>&1 &
          FPID=$!
          trap 'kill -9 "$BPID" "$FPID" 2>/dev/null || true' EXIT
          wait_ready http://127.0.0.1:8001/
          wait_ready http://127.0.0.1:8002/
          timeout 10s oha -n 200 -c 25 --no-tui --output-format quiet http://127.0.0.1:8001/ >/dev/null
          timeout 10s oha -n 200 -c 25 --no-tui --output-format quiet http://127.0.0.1:8002/ >/dev/null
          hit() {
            local name="$1" port="$2" endpoint="$3" run="$4"
            [[ "$endpoint" == static ]] && path='/' || path='/users/42'
            timeout 10s oha -n 2000 -c 50 --no-tui --output-format json "http://127.0.0.1:${port}${path}" >"bench-results/${name}-${endpoint}-${run}.json"
          }
          for endpoint in static dynamic; do
            hit baseline 8001 "$endpoint" 1
            hit fast     8002 "$endpoint" 1
            hit fast     8002 "$endpoint" 2
            hit baseline 8001 "$endpoint" 2
            hit baseline 8001 "$endpoint" 3
            hit fast     8002 "$endpoint" 3
            hit fast     8002 "$endpoint" 4
            hit baseline 8001 "$endpoint" 4
          done
      - name: Summarize
        run: |
          python - <<'PY'
          import json, statistics
          for endpoint in ('static','dynamic'):
              vals={}
              for name in ('baseline','fast'):
                  rs=[]; ls=[]
                  for run in (1,2,3,4):
                      d=json.load(open(f'bench-results/{name}-{endpoint}-{run}.json'))['summary']
                      rs.append(d['requestsPerSec']); ls.append(d['average']*1000)
                  vals[name]=(statistics.median(rs),statistics.median(ls),rs)
              b,f=vals['baseline'],vals['fast']
              print(f"{endpoint}: baseline={b[0]:.1f} req/s fast={f[0]:.1f} req/s change={(f[0]/b[0]-1)*100:+.2f}% | latency {b[1]:.3f}->{f[1]:.3f} ms")
              print('  baseline runs:', ', '.join(f'{v:.1f}' for v in b[2]))
              print('  fast runs:    ', ', '.join(f'{v:.1f}' for v in f[2]))
          PY
