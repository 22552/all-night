name: Apply cache and Midnight reconnect
on:
  push:
    branches: [feat/cache-midnight-reconnect]
    paths: [.github/workflows/apply-cache-reconnect.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Apply feature patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # Night @app.cache -------------------------------------------------
          p = Path('night.py')
          s = p.read_text()
          s = s.replace('import email.utils\nimport gzip\n', 'import email.utils\nimport functools\nimport gzip\n', 1)
          marker = '''    def send_file(\n        self,\n        path: str,\n'''
          cache_method = '''    def cache(self, fn: t.Callable | None = None, *, ttl: float | None = None):\n        \"\"\"Cache a no-argument endpoint's completed response.\n\n        Use ``@app.get(...)`` above ``@app.cache``/``@app.cache()``. The first\n        cacheable response is snapshotted after serialization and later hits\n        receive a fresh mutable Response clone, so HEAD/cookies cannot mutate\n        the shared cached value. ``ttl=None`` keeps it until process exit.\n        \"\"\"\n        if ttl is not None and float(ttl) < 0:\n            raise ValueError(\"cache ttl must be >= 0 or None\")\n        lifetime = None if ttl is None else float(ttl)\n\n        def decorator(endpoint: t.Callable):\n            try:\n                signature = inspect.signature(endpoint)\n            except (TypeError, ValueError):\n                signature = None\n            if signature is not None and signature.parameters:\n                raise TypeError(\"@app.cache only supports no-argument endpoints\")\n\n            cached: tuple[float, int, bytes, dict[str, str], tuple[tuple[str, str], ...]] | None = None\n\n            def restore(snapshot):\n                _created, status, body, headers, raw_headers = snapshot\n                response = object.__new__(Response)\n                response.status = status\n                response.body = body\n                response.headers = dict(headers)\n                response.raw_headers = list(raw_headers)\n                return response\n\n            def fresh(snapshot) -> bool:\n                return lifetime is None or time.monotonic() - snapshot[0] < lifetime\n\n            def store(value):\n                nonlocal cached\n                response = self._coerce_response(value)\n                has_cookie = \"set-cookie\" in response.headers or any(\n                    str(key).lower() == \"set-cookie\" for key, _ in response.raw_headers\n                )\n                if 200 <= response.status < 400 and not has_cookie:\n                    cached = (\n                        time.monotonic(),\n                        response.status,\n                        response.body,\n                        dict(response.headers),\n                        tuple(response.raw_headers),\n                    )\n                    return restore(cached)\n                return response\n\n            if inspect.iscoroutinefunction(endpoint):\n                @functools.wraps(endpoint)\n                async def async_cached():\n                    nonlocal cached\n                    snapshot = cached\n                    if snapshot is not None and fresh(snapshot):\n                        return restore(snapshot)\n                    cached = None\n                    return store(await endpoint())\n                async_cached.cache_clear = lambda: _clear()\n                wrapper = async_cached\n            else:\n                @functools.wraps(endpoint)\n                def sync_cached():\n                    nonlocal cached\n                    snapshot = cached\n                    if snapshot is not None and fresh(snapshot):\n                        return restore(snapshot)\n                    cached = None\n                    return store(endpoint())\n                sync_cached.cache_clear = lambda: _clear()\n                wrapper = sync_cached\n\n            def _clear():\n                nonlocal cached\n                cached = None\n\n            return wrapper\n\n        return decorator if fn is None else decorator(fn)\n\n'''
          assert marker in s
          s = s.replace(marker, cache_method + marker, 1)
          p.write_text(s)

          # Midnight Python API ---------------------------------------------
          p = Path('night_midnight.py')
          s = p.read_text()
          old = '''    def ws_connect(\n        self,\n        url: str,\n        *,\n        socket_id: str = \"default\",\n        protocols: list[str] | None = None,\n    ) -> None:\n        self._push(\n            \"ws_connect\",\n            url=str(url),\n            socket_id=str(socket_id),\n            protocols=list(protocols or []),\n        )\n'''
          new = '''    def ws_connect(\n        self,\n        url: str,\n        *,\n        socket_id: str = \"default\",\n        protocols: list[str] | None = None,\n        reconnect: bool = True,\n        reconnect_delay: float = 0.5,\n        reconnect_max_delay: float = 5.0,\n    ) -> None:\n        reconnect_delay = float(reconnect_delay)\n        reconnect_max_delay = float(reconnect_max_delay)\n        if reconnect_delay < 0 or reconnect_max_delay < 0:\n            raise ValueError(\"WebSocket reconnect delays must be >= 0\")\n        if reconnect_max_delay < reconnect_delay:\n            raise ValueError(\"reconnect_max_delay must be >= reconnect_delay\")\n        self._push(\n            \"ws_connect\",\n            url=str(url),\n            socket_id=str(socket_id),\n            protocols=list(protocols or []),\n            reconnect=bool(reconnect),\n            reconnect_delay_ms=int(reconnect_delay * 1000),\n            reconnect_max_delay_ms=int(reconnect_max_delay * 1000),\n        )\n'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          # Browser Midnight WebSocket reconnect ----------------------------
          p = Path('deploy/browser-night/midnight.js')
          s = p.read_text()
          s = s.replace('''    sockets: new Map(),\n    persistence: new Map(),\n''', '''    sockets: new Map(),\n    socketConfigs: new Map(),\n    socketReconnectTimers: new Map(),\n    socketReconnectAttempts: new Map(),\n    persistence: new Map(),\n''', 1)
          start = s.index('  function connect(url, options = {}) {')
          end = s.index('\n  function persistBody(item) {', start)
          replacement = '''  function clearReconnectTimer(socketId) {\n    const timer = state.socketReconnectTimers.get(socketId);\n    if (timer != null) clearTimeout(timer);\n    state.socketReconnectTimers.delete(socketId);\n  }\n\n  function scheduleReconnect(socketId, config) {\n    if (!config || !config.reconnect || config.closed) return;\n    clearReconnectTimer(socketId);\n    const attempt = (state.socketReconnectAttempts.get(socketId) || 0) + 1;\n    state.socketReconnectAttempts.set(socketId, attempt);\n    const base = Math.max(0, Number(config.reconnectDelayMs ?? 500));\n    const cap = Math.max(base, Number(config.reconnectMaxDelayMs ?? 5000));\n    const delay = Math.min(cap, base * (2 ** Math.max(0, attempt - 1)));\n    post(\"midnight-ws\", socketPayload(socketId, \"reconnect\", { attempt, delay }));\n    const timer = setTimeout(() => {\n      state.socketReconnectTimers.delete(socketId);\n      if (state.socketConfigs.get(socketId) !== config || config.closed) return;\n      connect(config.url, { ...config, socketId, _reconnect: true });\n    }, delay);\n    state.socketReconnectTimers.set(socketId, timer);\n  }\n\n  function connect(url, options = {}) {\n    const socketId = String(options.socketId ?? options.socket_id ?? \"default\");\n    const isReconnect = Boolean(options._reconnect);\n    let config;\n    if (isReconnect) {\n      config = state.socketConfigs.get(socketId);\n      if (!config || config.closed) return null;\n    } else {\n      config = {\n        url: String(url),\n        protocols: Array.isArray(options.protocols) ? [...options.protocols] : [],\n        reconnect: options.reconnect !== false,\n        reconnectDelayMs: Math.max(0, Number(options.reconnectDelayMs ?? options.reconnect_delay_ms ?? 500)),\n        reconnectMaxDelayMs: Math.max(0, Number(options.reconnectMaxDelayMs ?? options.reconnect_max_delay_ms ?? 5000)),\n        closed: false,\n      };\n      config.reconnectMaxDelayMs = Math.max(config.reconnectDelayMs, config.reconnectMaxDelayMs);\n      clearReconnectTimer(socketId);\n      state.socketReconnectAttempts.set(socketId, 0);\n      state.socketConfigs.set(socketId, config);\n      const previous = state.sockets.get(socketId);\n      if (previous) {\n        state.sockets.delete(socketId);\n        previous.close(1000, \"replaced\");\n      }\n    }\n\n    const protocols = config.protocols;\n    const ws = protocols.length ? new WebSocket(config.url, protocols) : new WebSocket(config.url);\n    state.sockets.set(socketId, ws);\n    ws.addEventListener(\"open\", () => {\n      state.socketReconnectAttempts.set(socketId, 0);\n      post(\"midnight-ws\", socketPayload(socketId, \"open\", { url: ws.url }));\n    });\n    ws.addEventListener(\"message\", event => {\n      let json = null;\n      if (typeof event.data === \"string\") {\n        try { json = JSON.parse(event.data); } catch {}\n      }\n      post(\"midnight-ws\", socketPayload(socketId, \"message\", {\n        data: typeof event.data === \"string\" ? event.data : null,\n        json,\n      }));\n    });\n    ws.addEventListener(\"close\", event => {\n      post(\"midnight-ws\", socketPayload(socketId, \"close\", {\n        code: event.code,\n        reason: event.reason,\n        clean: event.wasClean,\n      }));\n      if (state.sockets.get(socketId) === ws) {\n        state.sockets.delete(socketId);\n        if (state.socketConfigs.get(socketId) === config && !config.closed) {\n          scheduleReconnect(socketId, config);\n        }\n      }\n    });\n    ws.addEventListener(\"error\", () => post(\"midnight-ws\", socketPayload(socketId, \"error\")));\n    return ws;\n  }\n\n  function send(data, socketId = \"default\") {\n    const ws = state.sockets.get(String(socketId));\n    if (!ws || ws.readyState !== WebSocket.OPEN) return false;\n    ws.send(typeof data === \"string\" || data instanceof ArrayBuffer || ArrayBuffer.isView(data)\n      ? data\n      : JSON.stringify(data));\n    return true;\n  }\n\n  function close(socketId = \"default\", code = 1000, reason = \"\") {\n    socketId = String(socketId);\n    const config = state.socketConfigs.get(socketId);\n    if (config) config.closed = true;\n    clearReconnectTimer(socketId);\n    state.socketConfigs.delete(socketId);\n    state.socketReconnectAttempts.delete(socketId);\n    const ws = state.sockets.get(socketId);\n    if (!ws) return Boolean(config);\n    state.sockets.delete(socketId);\n    ws.close(Number(code), String(reason));\n    return true;\n  }\n'''
          s = s[:start] + replacement + s[end:]
          s = s.replace('''      case \"ws_connect\":\n        connect(command.url, { socketId: command.socket_id, protocols: command.protocols || [] });\n        break;\n''', '''      case \"ws_connect\":\n        connect(command.url, {\n          socketId: command.socket_id,\n          protocols: command.protocols || [],\n          reconnect: command.reconnect !== false,\n          reconnectDelayMs: command.reconnect_delay_ms,\n          reconnectMaxDelayMs: command.reconnect_max_delay_ms,\n        });\n        break;\n''', 1)
          p.write_text(s)
          PY

          cat > tests/test_cache_decorator.py <<'PY'
          import asyncio
          import time
          import pytest
          from night import Night

          def test_cache_reuses_completed_json_response_and_clones():
              app = Night()
              calls = []

              @app.get('/cached')
              @app.cache
              def cached():
                  calls.append(1)
                  return {'value': len(calls)}

              with app.test_client() as client:
                  first = client.get('/cached')
                  second = client.get('/cached')
              assert first.get_json() == {'value': 1}
              assert second.get_json() == {'value': 1}
              assert len(calls) == 1

          def test_cache_head_does_not_destroy_cached_body():
              app = Night()
              calls = 0

              @app.get('/cached')
              @app.cache()
              def cached():
                  nonlocal calls
                  calls += 1
                  return 'hello'

              with app.test_client() as client:
                  assert client.get('/cached').text == 'hello'
                  assert client.request('HEAD', '/cached').data == b''
                  assert client.get('/cached').text == 'hello'
              assert calls == 1

          def test_cache_ttl_and_clear():
              app = Night()
              calls = 0

              @app.get('/cached')
              @app.cache(ttl=0.01)
              def cached():
                  nonlocal calls
                  calls += 1
                  return {'n': calls}

              with app.test_client() as client:
                  assert client.get('/cached').get_json() == {'n': 1}
                  cached.cache_clear()
                  assert client.get('/cached').get_json() == {'n': 2}
                  time.sleep(0.02)
                  assert client.get('/cached').get_json() == {'n': 3}

          def test_cache_rejects_request_dependent_endpoint():
              app = Night()
              with pytest.raises(TypeError):
                  @app.cache
                  def bad(req):
                      return req.path
          PY

          cat > tests/test_midnight_reconnect.py <<'PY'
          import pytest
          from night_midnight import Midnight

          def test_ws_connect_emits_reconnect_configuration():
              midnight = Midnight()
              midnight.ws_connect(
                  'wss://example.test/ws',
                  socket_id='chat',
                  protocols=['json'],
                  reconnect=True,
                  reconnect_delay=0.25,
                  reconnect_max_delay=4,
              )
              command = midnight.drain()[-1]
              assert command == {
                  'op': 'ws_connect',
                  'url': 'wss://example.test/ws',
                  'socket_id': 'chat',
                  'protocols': ['json'],
                  'reconnect': True,
                  'reconnect_delay_ms': 250,
                  'reconnect_max_delay_ms': 4000,
              }

          def test_ws_connect_can_disable_reconnect_and_validates_delays():
              midnight = Midnight()
              midnight.ws_connect('ws://example.test', reconnect=False)
              assert midnight.drain()[-1]['reconnect'] is False
              with pytest.raises(ValueError):
                  midnight.ws_connect('ws://example.test', reconnect_delay=-1)
              with pytest.raises(ValueError):
                  midnight.ws_connect('ws://example.test', reconnect_delay=2, reconnect_max_delay=1)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('docs/guides/http.md'); s=p.read_text()
          s += '''\n\n## Endpoint response cache\n\nFor pure no-argument endpoints whose completed response can be reused, put `@app.cache` below the route decorator:\n\n```python\n@app.get("/catalog")\n@app.cache\ndef catalog():\n    return {"items": build_catalog()}\n```\n\n`@app.cache(ttl=30)` expires the snapshot after 30 seconds; the default `ttl=None` keeps it for the process lifetime. Cached responses are cloned on every hit so `HEAD`, cookies, and later response mutation cannot corrupt the shared snapshot. Responses carrying `Set-Cookie` and responses outside the 2xx/3xx range are not cached. The decorator intentionally supports no-argument endpoints only; request-dependent handlers should use an application-specific cache key instead.\n'''
          p.write_text(s)

          p=Path('docs/guides/midnight.md'); s=p.read_text()
          s += '''\n\n## WebSocket reconnect\n\nMidnight WebSockets reconnect automatically after an unexpected close. Reconnect uses capped exponential backoff and resets after a successful `open`:\n\n```python\nmidnight.ws_connect(\n    "wss://example.com/live",\n    reconnect=True,\n    reconnect_delay=0.5,\n    reconnect_max_delay=5.0,\n)\n```\n\n`reconnect=False` disables this behavior. Calling `midnight.ws_close()` is treated as an explicit close and cancels pending reconnects. `@midnight.on_ws("reconnect")` can observe retry attempts; its payload includes `attempt` and `delay` (milliseconds). Normal `open`, `message`, `close`, and `error` events are unchanged.\n'''
          p.write_text(s)
          PY

      - name: Test
        run: |
          python -m pip install -U pytest
          python -m pytest -q
          node --check deploy/browser-night/midnight.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add night.py night_midnight.py deploy/browser-night/midnight.js tests docs
          git commit -m 'add endpoint cache and Midnight websocket reconnect'
          git push
