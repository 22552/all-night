name: Cache benchmark
on:
  push:
    branches: [feat/cache-midnight-reconnect]
    paths: [.github/workflows/cache-benchmark.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install
        run: |
          python -m pip install -U 'uvicorn[standard]' orjson
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
      - name: Apps
        run: |
          cat > bench_uncached.py <<'PY'
          from night import Night
          app=Night().fast()
          payload={'items':[{'id':i,'name':f'item-{i}','enabled':True} for i in range(100)]}
          @app.get('/')
          def root(): return payload
          PY
          cat > bench_cached.py <<'PY'
          from night import Night
          app=Night().fast()
          payload={'items':[{'id':i,'name':f'item-{i}','enabled':True} for i in range(100)]}
          @app.get('/')
          @app.cache
          def root(): return payload
          PY
      - name: Benchmark
        run: |
          set -euo pipefail; mkdir -p results
          bench(){ local name=$1 mod=$2 run=$3; uvicorn $mod:app --host 127.0.0.1 --port 8740 --workers 1 --no-access-log --loop uvloop --http httptools >/tmp/$name.log 2>&1 & pid=$!; for i in $(seq 1 100); do curl -fsS http://127.0.0.1:8740/ >/dev/null 2>&1 && break; sleep .1; done; oha -n 1000 -c 50 --no-tui --output-format quiet http://127.0.0.1:8740/ >/dev/null; oha -n 12000 -c 50 --no-tui --output-format json http://127.0.0.1:8740/ > results/$name-$run.json; kill -9 $pid 2>/dev/null || true; wait $pid 2>/dev/null || true; sleep .1; }
          for r in 1 2 3 4 5 6; do if ((r%2)); then bench uncached bench_uncached $r; bench cached bench_cached $r; else bench cached bench_cached $r; bench uncached bench_uncached $r; fi; done
          python - <<'PY'
          import json,statistics
          u=[json.load(open(f'results/uncached-{r}.json'))['summary']['requestsPerSec'] for r in range(1,7)]
          c=[json.load(open(f'results/cached-{r}.json'))['summary']['requestsPerSec'] for r in range(1,7)]
          um,cm=statistics.median(u),statistics.median(c)
          print('uncached',um,u); print('cached',cm,c); print('delta_percent',(cm/um-1)*100); print('ratio',cm/um)
          PY
