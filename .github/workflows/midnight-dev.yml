name: Midnight development

on:
  push:
    branches:
      - feature/midnight

permissions:
  contents: write

jobs:
  wire-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/midnight
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wire Midnight
        run: python tools/wire_midnight.py
      - name: Test Midnight
        run: |
          python -m pip install -U pytest
          python -m pytest -q tests
          node --check deploy/browser-night/midnight.js
          python - <<'PY'
          from pathlib import Path
          html = Path('deploy/browser-night/404.html').read_text()
          assert 'night_midnight.py' in html
          assert 'midnight.js' in html
          assert 'midnight-event' in html
          assert 'midnight-ws' in html
          assert 'nightMidnightPush' in html
          PY
      - name: Commit generated wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml README.md docs/README.md docs/ja/README.md deploy/browser-night/404.html deploy/browser-night/app.py
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Wire Midnight into Browser Night"
            git push origin HEAD:feature/midnight
          fi
