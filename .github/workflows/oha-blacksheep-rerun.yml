name: Temporary Night fast-mode benchmark

on:
  push:
    branches:
      - bench/oha-blacksheep-rerun-20260809

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'uvicorn==0.52.1' blacksheep orjson uvloop httptools
      - name: Install oha
        run: cargo install oha --locked
      - name: Create benchmark apps
        run: |
          cat > bench_fast_apps.py <<'PY'
          from night import Night

          night_app = Night()
          @night_app.get('/')
          def night_home(): return {'message': 'hello'}
          @night_app.get('/users/<int:id>')
          def night_user(id: int): return {'id': id}

          night_fast_app = Night().fast()
          @night_fast_app.get('/')
          def night_fast_home(): return {'message': 'hello'}
          @night_fast_app.get('/users/<int:id>')
          def night_fast_user(id: int): return {'id': id}

          from blacksheep import Application
          from blacksheep.server.responses import json as bs_json
          blacksheep_app = Application()
          @blacksheep_app.router.get('/')
          async def blacksheep_home(): return bs_json({'message': 'hello'})
          @blacksheep_app.router.get('/users/{id}')
          async def blacksheep_user(id: int): return bs_json({'id': id})
          PY
      - name: Run oha benchmark
        shell: bash
        run: |
          set -u
          mkdir -p bench-results
          start_uvicorn() {
            app="$1"; port="$2"
            python -m uvicorn "$app" --host 127.0.0.1 --port "$port" --workers 1 --loop uvloop --http httptools --log-level warning >"bench-results/server-${port}.log" 2>&1 &
            SERVER_PID=$!
            for i in $(seq 1 100); do
              curl -fsS "http://127.0.0.1:${port}/" >/dev/null 2>&1 && return 0
              sleep 0.1
            done
            cat "bench-results/server-${port}.log" || true
            return 1
          }
          stop_server() {
            pid="$1"
            kill "$pid" 2>/dev/null || true
            sleep 0.2
            kill -9 "$pid" 2>/dev/null || true
          }
          run_case() {
            name="$1"; port="$2"; path="$3"; label="$4"
            echo "===== ${name} ${label} ====="
            for round in 1 2 3 4; do
              timeout 15s oha --no-tui -n 4000 -c 50 "http://127.0.0.1:${port}${path}" >"bench-results/${name}-${label}-${round}.txt" 2>&1
              rc=$?
              cat "bench-results/${name}-${label}-${round}.txt"
              [ "$rc" -eq 0 ] || echo "OHA_EXIT=$rc ${name} ${label} round=${round}"
            done
          }

          for spec in \
            'Night bench_fast_apps:night_app 8001' \
            'NightFast bench_fast_apps:night_fast_app 8002' \
            'BlackSheep bench_fast_apps:blacksheep_app 8003'
          do
            set -- $spec
            name="$1"; app="$2"; port="$3"
            if start_uvicorn "$app" "$port"; then
              run_case "$name" "$port" '/' static
              run_case "$name" "$port" '/users/42' dynamic
              stop_server "$SERVER_PID"
            fi
          done

          python - <<'PY'
          from pathlib import Path
          import re, statistics
          print('\n===== MEDIANS =====')
          for name in ['Night','NightFast','BlackSheep']:
              for label in ['static','dynamic']:
                  rps=[]; avgs=[]; p50=[]; p99=[]
                  for p in sorted(Path('bench-results').glob(f'{name}-{label}-*.txt')):
                      text=p.read_text(errors='replace')
                      m=re.search(r'Requests/sec:\s*([0-9.]+)', text)
                      a=re.search(r'Average:\s*([0-9.]+) ms', text)
                      q50=re.search(r'50\.00% in ([0-9.]+) ms', text)
                      q99=re.search(r'99\.00% in ([0-9.]+) ms', text)
                      if m: rps.append(float(m.group(1)))
                      if a: avgs.append(float(a.group(1)))
                      if q50: p50.append(float(q50.group(1)))
                      if q99: p99.append(float(q99.group(1)))
                  if rps:
                      print(f'{name:11s} {label:7s} {statistics.median(rps):10.1f} req/s  avg={statistics.median(avgs):6.3f}ms p50={statistics.median(p50):6.3f}ms p99={statistics.median(p99):6.3f}ms rounds={rps}')
                  else:
                      print(f'{name:11s} {label:7s} NO_RESULT')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-fastmode-oha-results
          path: bench-results
