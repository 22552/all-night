name: Non-routing hotpath experiment
on:
  push:
    branches: [perf/non-routing-hotpath]
    paths: [.github/workflows/non-routing-hotpath.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install
        run: |
          python -m pip install -U 'uvicorn[standard]' orjson pytest
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
      - name: Build variants
        run: |
          cp night.py night_baseline.py
          python - <<'PY'
          from pathlib import Path
          p=Path('night.py'); s=p.read_text()
          old='''_HTTP_DATE_CACHE_SECOND = -1\n_HTTP_DATE_CACHE_VALUE = \"\"\n\ndef _cached_http_date() -> str:\n    global _HTTP_DATE_CACHE_SECOND, _HTTP_DATE_CACHE_VALUE\n    second = int(time.time())\n    if second != _HTTP_DATE_CACHE_SECOND:\n        _HTTP_DATE_CACHE_SECOND = second\n        _HTTP_DATE_CACHE_VALUE = email.utils.formatdate(second, usegmt=True)\n    return _HTTP_DATE_CACHE_VALUE'''
          new='''_HTTP_DATE_CACHE_SECOND = -1\n_HTTP_DATE_CACHE_VALUE = \"\"\n_HTTP_DATE_CACHE_BYTES = b\"\"\n\ndef _cached_http_date() -> str:\n    global _HTTP_DATE_CACHE_SECOND, _HTTP_DATE_CACHE_VALUE, _HTTP_DATE_CACHE_BYTES\n    second = int(time.time())\n    if second != _HTTP_DATE_CACHE_SECOND:\n        _HTTP_DATE_CACHE_SECOND = second\n        _HTTP_DATE_CACHE_VALUE = email.utils.formatdate(second, usegmt=True)\n        _HTTP_DATE_CACHE_BYTES = _HTTP_DATE_CACHE_VALUE.encode(\"latin-1\")\n    return _HTTP_DATE_CACHE_VALUE\n\ndef _cached_http_date_bytes() -> bytes:\n    _cached_http_date()\n    return _HTTP_DATE_CACHE_BYTES\n\n_HEADER_NAME_BYTES = {\n    \"date\": b\"date\",\n    \"content-length\": b\"content-length\",\n    \"content-type\": b\"content-type\",\n    \"cache-control\": b\"cache-control\",\n    \"etag\": b\"etag\",\n    \"last-modified\": b\"last-modified\",\n    \"vary\": b\"vary\",\n    \"content-encoding\": b\"content-encoding\",\n}\n_CONTENT_TYPE_BYTES = {\n    \"application/json; charset=utf-8\": b\"application/json; charset=utf-8\",\n    \"text/plain; charset=utf-8\": b\"text/plain; charset=utf-8\",\n    \"text/html; charset=utf-8\": b\"text/html; charset=utf-8\",\n}'''
          assert old in s; s=s.replace(old,new,1)
          old='''    def asgi_headers(self) -> list[tuple[bytes, bytes]]:\n        encoded = [\n            (k.encode(\"latin-1\"), v.encode(\"latin-1\"))\n            for k, v in self.headers.items()\n            if k != \"set-cookie\"\n        ]\n        if self.raw_headers:\n            encoded.extend(\n                (k.encode(\"latin-1\"), v.encode(\"latin-1\"))\n                for k, v in self.raw_headers\n            )\n        return encoded'''
          new='''    def asgi_headers(self) -> list[tuple[bytes, bytes]]:\n        encoded = []\n        append = encoded.append\n        for k, v in self.headers.items():\n            if k == \"set-cookie\":\n                continue\n            kb = _HEADER_NAME_BYTES.get(k)\n            if kb is None:\n                kb = k.encode(\"latin-1\")\n            if k == \"date\" and v == _HTTP_DATE_CACHE_VALUE:\n                vb = _cached_http_date_bytes()\n            else:\n                vb = _CONTENT_TYPE_BYTES.get(v)\n                if vb is None:\n                    vb = v.encode(\"latin-1\")\n            append((kb, vb))\n        if self.raw_headers:\n            encoded.extend((k.encode(\"latin-1\"), v.encode(\"latin-1\")) for k, v in self.raw_headers)\n        return encoded'''
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          PY
          cat > bench_base.py <<'PY'
          import importlib.util,sys
          spec=importlib.util.spec_from_file_location('night_base_mod','night_baseline.py'); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          app=m.Night().fast()
          @app.get('/')
          async def root(): return {'message':'hello'}
          PY
          cat > bench_fast.py <<'PY'
          from night import Night
          app=Night().fast()
          @app.get('/')
          async def root(): return {'message':'hello'}
          PY
      - name: Tests
        run: python -m pytest -q
      - name: Microbench
        run: |
          python - <<'PY'
          import importlib.util,sys,time
          spec=importlib.util.spec_from_file_location('b','night_baseline.py'); b=importlib.util.module_from_spec(spec); sys.modules['b']=b; spec.loader.exec_module(b)
          import night as f
          N=500000
          for mod in (b,f):
              r=mod.JSONResponse({'message':'hello'}, dumps=getattr(__import__('orjson'),'dumps'))
              t=time.perf_counter()
              for _ in range(N): r.asgi_headers()
              print(mod.__name__, N/(time.perf_counter()-t))
          PY
      - name: HTTP benchmark
        run: |
          set -euo pipefail
          mkdir -p bench-results
          bench(){ local n=$1 m=$2 r=$3; uvicorn $m:app --host 127.0.0.1 --port 8700 --workers 1 --no-access-log --loop uvloop --http httptools >/tmp/$n.log 2>&1 & pid=$!; for i in $(seq 1 100); do curl -fsS http://127.0.0.1:8700/ >/dev/null 2>&1 && break; sleep .1; done; oha -n 500 -c 30 --no-tui --output-format quiet http://127.0.0.1:8700/ >/dev/null; oha -n 10000 -c 50 --no-tui --output-format json http://127.0.0.1:8700/ > bench-results/$n-$r.json; kill -9 $pid 2>/dev/null || true; wait $pid 2>/dev/null || true; sleep .1; }
          for r in 1 2 3 4 5 6; do if ((r%2)); then bench base bench_base $r; bench fast bench_fast $r; else bench fast bench_fast $r; bench base bench_base $r; fi; done
          python - <<'PY'
          import json,statistics
          b=[json.load(open(f'bench-results/base-{r}.json'))['summary']['requestsPerSec'] for r in range(1,7)]
          f=[json.load(open(f'bench-results/fast-{r}.json'))['summary']['requestsPerSec'] for r in range(1,7)]
          bm,fm=statistics.median(b),statistics.median(f)
          print('base',bm,b); print('fast',fm,f); print('delta', (fm/bm-1)*100)
          PY