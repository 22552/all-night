name: Integrate FastNight

on:
  push:
    branches: ["perf/integrate-fastnight"]
    paths:
      - ".github/workflows/integrate-fastnight.yml"
      - "tools/integrate_fastnight.py"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/integrate-fastnight
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Integrate fast paths
        run: python tools/integrate_fastnight.py
      - name: Validate syntax
        run: python -m py_compile night.py deploy/cloudflare-night/src/entry.py benchmarks/fast_path.py tests/test_fast_paths.py
      - name: Commit integrated Night
        run: |
          git restore .github/workflows/test.yml .github/workflows/integrate-fastnight.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate FastNight hot paths into Night"
          git push origin HEAD:perf/integrate-fastnight
