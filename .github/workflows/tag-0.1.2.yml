name: Tag v0.1.2

on:
  push:
    branches:
      - release/0.1.2-browser-docs
    paths:
      - ".github/workflows/tag-0.1.2.yml"

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify release target
        run: |
          python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("https://pypi.org/pypi/all-night/json", timeout=20) as response:
              releases = json.load(response).get("releases", {})
          if "0.1.2" in releases:
              raise SystemExit("all-night 0.1.2 already exists on PyPI")
          PY
          test "$(git rev-parse HEAD)" = "0795c5c07935d937ad10eb42365eebeb369b5945"
          test "$(python - <<'PY'
          import tomllib
          with open('pyproject.toml','rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )" = "0.1.2"
      - name: Ensure tag
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/v0.1.2" >/dev/null 2>&1; then
            test "$(git rev-parse refs/tags/v0.1.2)" = "0795c5c07935d937ad10eb42365eebeb369b5945"
          else
            git tag v0.1.2 0795c5c07935d937ad10eb42365eebeb369b5945
            git push origin refs/tags/v0.1.2
          fi
      - name: Dispatch existing PyPI workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref v0.1.2
