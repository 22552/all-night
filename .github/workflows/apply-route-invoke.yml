name: Apply route invoke optimization
on:
  push:
    branches: [perf/route-invoke]
    paths:
      - tools/apply_route_invoke.py
      - .github/workflows/apply-route-invoke.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/route-invoke
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/apply_route_invoke.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add night.py
          git commit -m 'perf: compile route invokers at registration' || exit 0
          git push
