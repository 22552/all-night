name: Release all-night 0.1.4

on:
  push:
    paths:
      - ".github/workflows/release-0.1.4.yml"

permissions:
  contents: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/all-night
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Apply 0.1.4 changes
        shell: python
        run: |
          from pathlib import Path

          night = Path("night.py")
          source = night.read_text()
          old = '''class WebSocket:\n    def __init__(self, scope: dict, receive, send):\n        self.scope = scope\n        self.receive = receive\n        self.send = send\n\n    @property\n    def path(self) -> str:\n        return self.scope.get("path") or "/"\n\n    async def accept(self, subprotocol: str | None = None):\n        event = {"type": "websocket.accept"}\n        if subprotocol:\n            event["subprotocol"] = subprotocol\n        await self.send(event)\n'''
          new = '''class WebSocket:\n    def __init__(self, scope: dict, receive, send):\n        self.scope = scope\n        self.receive = receive\n        self.send = send\n        self._connect_received = False\n        self._accepted = False\n\n    @property\n    def path(self) -> str:\n        return self.scope.get("path") or "/"\n\n    async def accept(self, subprotocol: str | None = None):\n        if not self._connect_received:\n            event = await self.receive()\n            event_type = event.get("type")\n            if event_type == "websocket.disconnect":\n                raise ConnectionError("WebSocket disconnected before accept")\n            if event_type != "websocket.connect":\n                raise RuntimeError(f"Expected websocket.connect before accept, got {event_type!r}")\n            self._connect_received = True\n\n        event = {"type": "websocket.accept"}\n        if subprotocol:\n            event["subprotocol"] = subprotocol\n        await self.send(event)\n        self._accepted = True\n'''
          if old not in source:
              raise SystemExit("WebSocket block did not match expected 0.1.3 source")
          night.write_text(source.replace(old, new, 1))

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text()
          if 'version = "0.1.3"' not in text:
              raise SystemExit("Expected pyproject 0.1.3")
          pyproject.write_text(text.replace('version = "0.1.3"', 'version = "0.1.4"', 1))

          version_test = Path("tests/test_browser_night_assets.py")
          text = version_test.read_text()
          text = text.replace("test_release_version_is_0_1_3", "test_release_version_is_0_1_4")
          text = text.replace('version = "0.1.3"', 'version = "0.1.4"')
          version_test.write_text(text)

          for filename in ("docs/README.md", "docs/ja/README.md"):
              path = Path(filename)
              text = path.read_text()
              text = text.replace("all-night 0.1.3", "all-night 0.1.4")
              path.write_text(text)

          Path("tests/test_websocket_handshake.py").write_text('''import asyncio\n\nfrom night import Night\n\n\ndef test_websocket_accept_consumes_connect_before_accepting():\n    app = Night()\n\n    @app.websocket("/ws")\n    async def echo(ws):\n        await ws.accept()\n        message = await ws.receive_text()\n        await ws.send_text(message)\n\n    events = [\n        {"type": "websocket.connect"},\n        {"type": "websocket.receive", "text": "hello"},\n    ]\n    sent = []\n\n    async def receive():\n        return events.pop(0)\n\n    async def send(event):\n        sent.append(event)\n\n    scope = {"type": "websocket", "path": "/ws", "headers": []}\n    asyncio.run(app(scope, receive, send))\n\n    assert sent == [\n        {"type": "websocket.accept"},\n        {"type": "websocket.send", "text": "hello"},\n    ]\n\n\ndef test_websocket_accept_handles_disconnect_before_handshake():\n    app = Night()\n\n    @app.websocket("/ws")\n    async def endpoint(ws):\n        await ws.accept()\n\n    async def receive():\n        return {"type": "websocket.disconnect", "code": 1001}\n\n    sent = []\n\n    async def send(event):\n        sent.append(event)\n\n    scope = {"type": "websocket", "path": "/ws", "headers": []}\n    asyncio.run(app(scope, receive, send))\n    assert sent == []\n''')

      - name: Install test and build tools
        run: python -m pip install --upgrade pytest build twine

      - name: Run tests
        run: python -m pytest -q

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Commit 0.1.4 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night.py pyproject.toml tests/test_browser_night_assets.py tests/test_websocket_handshake.py docs/README.md docs/ja/README.md
          git commit -m "Release all-night 0.1.4"
          git push origin HEAD:main

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
