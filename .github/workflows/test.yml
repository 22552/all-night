name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install benchmark frameworks
        if: matrix.python-version == '3.13'
        run: python -m pip install Flask robyn
      - name: Run tests
        run: python -m pytest -q tests
      - name: Run integrated Night fast-path benchmark
        if: matrix.python-version == '3.13'
        run: python benchmarks/fast_path.py
      - name: Run Web runtime demo
        run: python -m examples.web_runtime_demo
      - name: Build Cloudflare Night template
        run: |
          cd deploy/cloudflare-night
          npm run build
          python -m py_compile src/night.py src/entry.py

  node-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Node runtime dependencies
        run: npm install --ignore-scripts
      - name: Run Night Node runtime tests
        run: npm run test:node
      - name: Build Netlify Night function
        if: matrix.node-version == '24'
        working-directory: deploy/netlify-night
        run: |
          npm install
          npm run build:functions
