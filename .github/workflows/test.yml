name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Install benchmark frameworks
        if: matrix.python-version == '3.13'
        run: python -m pip install Flask robyn build
      - name: Run tests
        run: python -m pytest -q tests
      - name: Build core and Midnight wheels
        if: matrix.python-version == '3.13'
        run: |
          rm -rf dist
          python -m build --wheel --outdir dist .
          python -m build --wheel --outdir dist packages/midnight
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 2, wheels
          core = next(path for path in wheels if "all_night-" in path.name and "midnight" not in path.name)
          midnight = next(path for path in wheels if "all_night_midnight-" in path.name)
          with zipfile.ZipFile(core) as zf:
              names = set(zf.namelist())
              assert "night.py" in names
              assert "night_midnight.py" not in names
              assert "night_midnight_scope.py" not in names
              assert "midnight.js" not in names
          with zipfile.ZipFile(midnight) as zf:
              names = set(zf.namelist())
              assert "night_midnight.py" in names
              assert "night_midnight_scope.py" in names
              assert any(name.endswith("midnight.js") for name in names), names
          PY
      - name: Run integrated Night fast-path benchmark
        if: matrix.python-version == '3.13'
        run: python benchmarks/fast_path.py
      - name: Run Web runtime demo
        run: python -m examples.web_runtime_demo
      - name: Build Cloudflare Night template
        run: |
          cd deploy/cloudflare-night
          npm run build
          python -m py_compile src/night.py src/entry.py

  node-runtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Node runtime dependencies
        run: npm install --ignore-scripts
      - name: Run Night Node runtime tests
        run: npm run test:node
      - name: Build Netlify Night function
        if: matrix.node-version == '24'
        working-directory: deploy/netlify-night
        run: |
          npm install
          npm run build:functions
