name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: python -m pytest -q tests
      - name: Run Hono-style fast path benchmark
        if: matrix.python-version == '3.13'
        run: python benchmarks/fast_path.py
      - name: Run Web runtime demo
        run: python -m examples.web_runtime_demo
      - name: Build Cloudflare FastNight template
        run: |
          cd deploy/cloudflare-night
          npm run build
          python -m py_compile src/night.py src/night_fast.py src/portable_runtime.py src/web_runtime.py src/entry.py
