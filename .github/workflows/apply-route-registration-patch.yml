name: Apply route registration patch

on:
  push:
    branches:
      - agent/route-registration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/route-registration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply Night route patch
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("night.py")
          source = path.read_text()

          start = source.index("class Router:\n")
          end = source.index("\n\nclass Blueprint(Router):", start)
          new_router = dedent('''\
          class Router:
              """A blueprint-like container for routes."""

              def __init__(self):
                  self.routes: list[Route] = []

              def add_route(
                  self,
                  method: str | t.Iterable[str],
                  path: str,
                  handler: t.Callable,
                  *,
                  name: str | None = None,
                  body: type | None = None,
              ):
                  methods = (method,) if isinstance(method, str) else method
                  methods_set = {m.upper() for m in methods}
                  pattern, names = compile_path(path)
                  route = Route(
                      methods=methods_set,
                      pattern=pattern,
                      param_names=names,
                      endpoint=handler,
                      raw_path=path,
                      name=name,
                      body_model=body,
                  )
                  if body is not None:
                      setattr(handler, "__night_body_model__", body)
                  self.routes.append(route)
                  hook = getattr(self, "_on_route_added", None)
                  if hook is not None:
                      hook(route)
                  return self

              def route(
                  self,
                  path: str,
                  methods: t.Iterable[str] = ("GET",),
                  *,
                  name: str | None = None,
                  body: type | None = None,
              ):
                  def decorator(fn: t.Callable):
                      self.add_route(methods, path, fn, name=name, body=body)
                      return fn

                  return decorator

              def _method(
                  self,
                  method: str,
                  path: str,
                  handler: t.Callable | None = None,
                  *,
                  name: str | None = None,
                  body: type | None = None,
              ):
                  if handler is None:
                      return self.route(path, methods=(method,), name=name, body=body)
                  return self.add_route(method, path, handler, name=name, body=body)

              def get(self, path: str, handler: t.Callable | None = None, *, name: str | None = None):
                  return self._method("GET", path, handler, name=name)

              def post(
                  self,
                  path: str,
                  handler: t.Callable | None = None,
                  *,
                  name: str | None = None,
                  body: type | None = None,
              ):
                  return self._method("POST", path, handler, name=name, body=body)

              def put(self, path: str, handler: t.Callable | None = None, *, name: str | None = None):
                  return self._method("PUT", path, handler, name=name)

              def delete(self, path: str, handler: t.Callable | None = None, *, name: str | None = None):
                  return self._method("DELETE", path, handler, name=name)

              def query(self, path: str, handler: t.Callable | None = None, *, name: str | None = None):
                  return self._method("QUERY", path, handler, name=name)

              def patch(self, path: str, handler: t.Callable | None = None, *, name: str | None = None):
                  return self._method("PATCH", path, handler, name=name)

              def purge(self, path: str, handler: t.Callable | None = None, *, name: str | None = None):
                  return self._method("PURGE", path, handler, name=name)
          ''')
          source = source[:start] + new_router + source[end:]

          replacements = (
              ("return _coerce(await _fn(req=req))", "return _coerce(await _fn(req=req, **params))"),
              ("return _coerce(_fn(req=req))", "return _coerce(_fn(req=req, **params))"),
              ("return _coerce(await _fn(req))", "return _coerce(await _fn(req, **params))"),
              ("return _coerce(_fn(req))", "return _coerce(_fn(req, **params))"),
          )
          for old, new in replacements:
              if old in source:
                  if source.count(old) != 1:
                      raise SystemExit(f"ambiguous invoker replacement: {old}")
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f"invoker replacement target not found: {old}")

          path.write_text(source)

          Path("tests/test_route_registration_styles.py").write_text(dedent('''\
          import dataclasses
          import json

          from night import Night, Request


          def test_decorator_explicit_and_chained_route_registration():
              app = Night()

              @app.get("/decorated")
              def decorated():
                  return "decorated"

              def explicit():
                  return "explicit"

              def direct():
                  return "direct"

              def chained():
                  return "chained"

              assert app.add_route("GET", "/explicit", explicit) is app
              assert app.get("/direct", direct) is app
              assert app.get("/chained", chained).add_route("GET", "/after-chain", explicit) is app

              with app.test_client() as client:
                  assert client.get("/decorated").text == "decorated"
                  assert client.get("/explicit").text == "explicit"
                  assert client.get("/direct").text == "direct"
                  assert client.get("/chained").text == "chained"
                  assert client.get("/after-chain").text == "explicit"


          def test_direct_post_body_model_and_multiple_methods():
              app = Night()

              @dataclasses.dataclass
              class Payload:
                  value: int

              def body_handler(data: Payload):
                  return {"value": data.value}

              def both():
                  return "both"

              assert app.post("/body", body_handler, body=Payload) is app
              assert app.add_route(("GET", "POST"), "/both", both) is app

              with app.test_client() as client:
                  response = client.post(
                      "/body",
                      data=json.dumps({"value": 7}),
                      headers={"content-type": "application/json"},
                  )
                  assert response.get_json() == {"value": 7}
                  assert client.get("/both").text == "both"
                  assert client.post("/both").text == "both"


          def test_request_handlers_keep_path_params_on_fast_invokers():
              app = Night()

              @app.get("/keyword/<int:user_id>")
              def keyword(user_id: int, *, req: Request):
                  return {"user_id": user_id, "path": req.path, "params": req.path_params}

              @app.get("/positional/<int:user_id>")
              def positional(req: Request, user_id: int):
                  return {"user_id": user_id, "path": req.path, "params": req.path_params}

              with app.test_client() as client:
                  assert client.get("/keyword/11").get_json() == {
                      "user_id": 11,
                      "path": "/keyword/11",
                      "params": {"user_id": 11},
                  }
                  assert client.get("/positional/12").get_json() == {
                      "user_id": 12,
                      "path": "/positional/12",
                      "params": {"user_id": 12},
                  }
          '''))
          PY
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run focused tests
        run: python -m pytest -q tests/test_route_invoke.py tests/test_route_registration_styles.py
      - name: Run full test suite
        run: python -m pytest -q tests
      - name: Check diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add night.py tests/test_route_registration_styles.py
          git diff --cached --quiet && exit 0
          git commit -m "Add explicit and chained route registration"
          git push origin HEAD:agent/route-registration
