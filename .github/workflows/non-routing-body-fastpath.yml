name: Non-routing request body experiment
on:
  push:
    branches: [perf/non-routing-hotpath]
    paths: [.github/workflows/non-routing-body-fastpath.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install
        run: |
          python -m pip install -U 'uvicorn[standard]' orjson pytest
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.15.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
      - name: Build variants
        run: |
          cp night.py night_baseline.py
          python - <<'PY'
          from pathlib import Path
          p=Path('night.py'); s=p.read_text()
          old='''    async def body(self) -> bytes:\n        if self._body is not None:\n            return self._body\n        body = bytearray()\n        content_length = self.header(\"content-length\")\n        if content_length and content_length.isdigit() and int(content_length) > self.max_body_size:\n            raise HTTPError(413, \"Request body too large\")\n        more = True\n        while more:\n            event = await self.receive()\n            if event[\"type\"] != \"http.request\":\n                continue\n            body += event.get(\"body\", b\"\")\n            if len(body) > self.max_body_size:\n                raise HTTPError(413, \"Request body too large\")\n            more = event.get(\"more_body\", False)\n        self._body = bytes(body)\n        return self._body'''
          new='''    async def body(self) -> bytes:\n        if self._body is not None:\n            return self._body\n        content_length = self.header(\"content-length\")\n        if content_length and content_length.isdigit() and int(content_length) > self.max_body_size:\n            raise HTTPError(413, \"Request body too large\")\n\n        while True:\n            event = await self.receive()\n            if event[\"type\"] == \"http.request\":\n                break\n        first = event.get(\"body\", b\"\")\n        if len(first) > self.max_body_size:\n            raise HTTPError(413, \"Request body too large\")\n        if not event.get(\"more_body\", False):\n            self._body = first if type(first) is bytes else bytes(first)\n            return self._body\n\n        body = bytearray(first)\n        while True:\n            event = await self.receive()\n            if event[\"type\"] != \"http.request\":\n                continue\n            body += event.get(\"body\", b\"\")\n            if len(body) > self.max_body_size:\n                raise HTTPError(413, \"Request body too large\")\n            if not event.get(\"more_body\", False):\n                break\n        self._body = bytes(body)\n        return self._body'''
          assert old in s; p.write_text(s.replace(old,new,1))
          PY
          cat > bench_base.py <<'PY'
          import importlib.util,sys
          spec=importlib.util.spec_from_file_location('night_base_mod','night_baseline.py'); m=importlib.util.module_from_spec(spec); sys.modules[spec.name]=m; spec.loader.exec_module(m)
          app=m.Night().fast()
          @app.post('/')
          async def root(req): return {'n': len(await req.body())}
          PY
          cat > bench_fast.py <<'PY'
          from night import Night
          app=Night().fast()
          @app.post('/')
          async def root(req): return {'n': len(await req.body())}
          PY
      - name: Tests
        run: python -m pytest -q
      - name: Body microbench
        run: |
          python - <<'PY'
          import importlib.util,sys,asyncio,time
          spec=importlib.util.spec_from_file_location('b','night_baseline.py'); b=importlib.util.module_from_spec(spec); sys.modules['b']=b; spec.loader.exec_module(b)
          import night as f
          payload=b'x'*1024; N=100000
          async def test(mod):
            async def send(e): pass
            t=time.perf_counter()
            for _ in range(N):
              used=False
              async def receive(): return {'type':'http.request','body':payload,'more_body':False}
              q=mod.Request({'method':'POST','path':'/','query_string':b'','headers':[(b'content-length',b'1024')]},receive,send)
              await q.body()
            return N/(time.perf_counter()-t)
          for mod in (b,f): print(mod.__name__, asyncio.run(test(mod)))
          PY
      - name: HTTP benchmark
        run: |
          set -euo pipefail; mkdir -p bench-results
          printf '%01024d' 0 > payload.txt
          bench(){ local n=$1 m=$2 r=$3; uvicorn $m:app --host 127.0.0.1 --port 8730 --workers 1 --no-access-log --loop uvloop --http httptools >/tmp/$n.log 2>&1 & pid=$!; for i in $(seq 1 100); do curl -fsS -X POST --data-binary @payload.txt http://127.0.0.1:8730/ >/dev/null 2>&1 && break; sleep .1; done; oha -n 500 -c 30 -m POST -D payload.txt --no-tui --output-format quiet http://127.0.0.1:8730/ >/dev/null; oha -n 8000 -c 50 -m POST -D payload.txt --no-tui --output-format json http://127.0.0.1:8730/ > bench-results/$n-$r.json; kill -9 $pid 2>/dev/null || true; wait $pid 2>/dev/null || true; sleep .1; }
          for r in 1 2 3 4 5 6; do if ((r%2)); then bench base bench_base $r; bench fast bench_fast $r; else bench fast bench_fast $r; bench base bench_base $r; fi; done
          python - <<'PY'
          import json,statistics
          b=[json.load(open(f'bench-results/base-{r}.json'))['summary']['requestsPerSec'] for r in range(1,7)]
          f=[json.load(open(f'bench-results/fast-{r}.json'))['summary']['requestsPerSec'] for r in range(1,7)]
          bm,fm=statistics.median(b),statistics.median(f)
          print('base',bm,b); print('fast',fm,f); print('delta', (fm/bm-1)*100)
          PY