name: Apply terminal dynamic hash

on:
  push:
    branches: [perf/terminal-dynamic-hash-clean]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/terminal-dynamic-hash-clean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python tools/apply_terminal_dynamic_hash.py
      - name: Smoke test
        run: |
          python -m py_compile night.py
          python - <<'PY'
          from night import Night
          app=Night()
          for i in range(200):
              def endpoint(id, _i=i): return {'route': _i, 'id': id}
              app.get(f'/dynamic/{i}/<int:id>')(endpoint)
          c=app.test_client()
          assert c.get('/dynamic/199/42').get_json() == {'route': 199, 'id': 42}
          assert c.get('/dynamic/0/7').get_json() == {'route': 0, 'id': 7}
          assert c.get('/dynamic/199/nope').status_code == 404
          c.close()
          PY
      - name: Remove one-shot files
        run: rm tools/apply_terminal_dynamic_hash.py .github/workflows/apply-terminal-dynamic-hash-clean.yml
      - name: Commit optimization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add night.py tools/apply_terminal_dynamic_hash.py .github/workflows/apply-terminal-dynamic-hash-clean.yml
          git commit -m 'perf: hash terminal dynamic routes by prefix'
          git push origin HEAD:perf/terminal-dynamic-hash-clean
