name: Optimize Midnight memory

on:
  push:
    paths:
      - ".github/workflows/optimize-midnight-memory.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bound Midnight session and outbox memory
        shell: python
        run: |
          from pathlib import Path

          p = Path("night_midnight.py")
          s = p.read_text()

          s = s.replace("import inspect\n", "import inspect\nimport time\n", 1)

          old_session = '''    def __init__(self, session_id: str) -> None:\n        self.id = str(session_id)\n        self.state: dict[str, t.Any] = {}\n        self._outbox: list[dict[str, t.Any]] = []\n\n    def push(self, command: dict[str, t.Any]) -> None:\n        self._outbox.append(command)\n\n    def drain(self) -> list[dict[str, t.Any]]:\n        queued, self._outbox = self._outbox, []\n        return queued\n'''
          new_session = '''    def __init__(\n        self,\n        session_id: str,\n        *,\n        max_outbox: int = 256,\n        clock: t.Callable[[], float] = time.monotonic,\n    ) -> None:\n        self.id = str(session_id)\n        self.state: dict[str, t.Any] = {}\n        self._outbox: list[dict[str, t.Any]] = []\n        self.max_outbox = max(1, int(max_outbox))\n        self._clock = clock\n        self.last_used = self._clock()\n\n    def touch(self) -> None:\n        self.last_used = self._clock()\n\n    def push(self, command: dict[str, t.Any]) -> None:\n        self.touch()\n        self._outbox.append(command)\n        overflow = len(self._outbox) - self.max_outbox\n        if overflow > 0:\n            del self._outbox[:overflow]\n\n    def drain(self) -> list[dict[str, t.Any]]:\n        self.touch()\n        queued, self._outbox = self._outbox, []\n        return queued\n'''
          if old_session not in s:
              raise SystemExit("MidnightSession block not found")
          s = s.replace(old_session, new_session, 1)

          old_init = '''    def __init__(self) -> None:\n        self._handlers: dict[tuple[str, str | None], list[Handler]] = {}\n        self._ws_handlers: dict[str, list[Handler]] = {}\n        self._subscriptions: list[dict[str, t.Any]] = []\n        self._subscription_keys: set[tuple[str, str | None, bool]] = set()\n        self._sessions: dict[str, MidnightSession] = {}\n        self._session_id: contextvars.ContextVar[str] = contextvars.ContextVar(\n            f"night_midnight_session_{id(self)}", default=self.DEFAULT_SESSION\n        )\n        self.templates = MidnightTemplateEngine()\n        self._get_session(self.DEFAULT_SESSION)\n'''
          new_init = '''    def __init__(\n        self,\n        *,\n        max_sessions: int = 256,\n        session_ttl: float = 300.0,\n        max_outbox: int = 256,\n        clock: t.Callable[[], float] = time.monotonic,\n    ) -> None:\n        self._handlers: dict[tuple[str, str | None], list[Handler]] = {}\n        self._ws_handlers: dict[str, list[Handler]] = {}\n        self._subscriptions: list[dict[str, t.Any]] = []\n        self._subscription_keys: set[tuple[str, str | None, bool]] = set()\n        self._sessions: dict[str, MidnightSession] = {}\n        self.max_sessions = max(1, int(max_sessions))\n        self.session_ttl = max(0.0, float(session_ttl))\n        self.max_outbox = max(1, int(max_outbox))\n        self._clock = clock\n        self._session_id: contextvars.ContextVar[str] = contextvars.ContextVar(\n            f"night_midnight_session_{id(self)}", default=self.DEFAULT_SESSION\n        )\n        self.templates = MidnightTemplateEngine()\n        self._get_session(self.DEFAULT_SESSION)\n'''
          if old_init not in s:
              raise SystemExit("Midnight init block not found")
          s = s.replace(old_init, new_init, 1)

          old_get = '''    def _get_session(self, key: str) -> MidnightSession:\n        session = self._sessions.get(key)\n        if session is None:\n            session = MidnightSession(key)\n            self._sessions[key] = session\n        return session\n'''
          new_get = '''    def _prune_sessions(self, *, keep: str | None = None) -> None:\n        now = self._clock()\n        if self.session_ttl > 0:\n            expired = [\n                key\n                for key, session in self._sessions.items()\n                if key != self.DEFAULT_SESSION\n                and key != keep\n                and now - session.last_used > self.session_ttl\n            ]\n            for key in expired:\n                self._sessions.pop(key, None)\n\n        while len(self._sessions) >= self.max_sessions:\n            candidates = [\n                (session.last_used, key)\n                for key, session in self._sessions.items()\n                if key != self.DEFAULT_SESSION and key != keep\n            ]\n            if not candidates:\n                break\n            _, oldest = min(candidates)\n            self._sessions.pop(oldest, None)\n\n    def _get_session(self, key: str) -> MidnightSession:\n        key = str(key)\n        session = self._sessions.get(key)\n        if session is None:\n            self._prune_sessions(keep=key)\n            session = MidnightSession(\n                key, max_outbox=self.max_outbox, clock=self._clock\n            )\n            self._sessions[key] = session\n        else:\n            session.touch()\n            self._prune_sessions(keep=key)\n        return session\n\n    def prune_sessions(self) -> int:\n        \"\"\"Drop expired/excess non-default sessions and return how many were removed.\"\"\"\n        before = len(self._sessions)\n        self._prune_sessions(keep=self.session_id)\n        return before - len(self._sessions)\n'''
          if old_get not in s:
              raise SystemExit("_get_session block not found")
          s = s.replace(old_get, new_get, 1)

          p.write_text(s)

          tests = Path("tests/test_midnight_memory.py")
          tests.write_text('''import time\n\nfrom night_midnight import Midnight, trusted_session_id\n\n\ndef test_midnight_caps_session_count_with_lru_eviction():\n    now = [0.0]\n    midnight = Midnight(max_sessions=3, session_ttl=0, clock=lambda: now[0])\n\n    for name in ("a", "b", "c", "d"):\n        now[0] += 1\n        with midnight.trusted_session(trusted_session_id(name)):\n            midnight.state["name"] = name\n\n    ids = midnight.session_ids()\n    assert "default" in ids\n    assert len(ids) <= 3\n    assert "d" in ids\n    assert "a" not in ids\n\n\ndef test_midnight_prunes_expired_sessions():\n    now = [0.0]\n    midnight = Midnight(max_sessions=10, session_ttl=5, clock=lambda: now[0])\n\n    with midnight.trusted_session(trusted_session_id("old")):\n        midnight.state["x"] = 1\n\n    now[0] = 10.0\n    with midnight.trusted_session(trusted_session_id("new")):\n        midnight.state["x"] = 2\n\n    midnight.prune_sessions()\n    assert "old" not in midnight.session_ids()\n    assert "new" in midnight.session_ids()\n\n\ndef test_midnight_caps_outbox():\n    midnight = Midnight(max_outbox=3)\n    for value in range(6):\n        midnight.text("#x", value)\n\n    commands = midnight.drain()\n    assert [item["value"] for item in commands] == ["3", "4", "5"]\n\n\ndef test_default_session_is_preserved():\n    midnight = Midnight(max_sessions=1, session_ttl=0)\n    with midnight.trusted_session(trusted_session_id("temporary")):\n        midnight.text("#x", "hello")\n    assert "default" in midnight.session_ids()\n''')
      - name: Run tests
        run: python -m pytest -q
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add night_midnight.py tests/test_midnight_memory.py
          git commit -m "Bound Midnight session memory"
          git push
